<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Dune Buggy - Hill Climb Racing</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      font-family: 'Arial Black', Impact, sans-serif;
    }
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Floating UI elements */
    .top-bar {
      position: absolute;
      top: 15px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 10;
    }

    .distance-badge {
      background: rgba(0, 0, 0, 0.6);
      border: 3px solid #ffcc00;
      border-radius: 12px;
      padding: 8px 18px;
      color: #fff;
      font-size: 22px;
      text-shadow: 2px 2px 0px #000;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    .distance-badge span {
      color: #ffcc00;
    }

    /* HUD Dashboard (Center Bottom) */
    .dashboard {
      position: absolute;
      bottom: 15px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: flex-end;
      gap: 15px;
      z-index: 10;
      pointer-events: none;
    }

    .gauge-container {
      position: relative;
      width: 110px;
      height: 110px;
      background: radial-gradient(circle, #222 60%, #000 100%);
      border: 4px solid #444;
      border-radius: 50%;
      box-shadow: inset 0 0 10px #000, 0 4px 12px rgba(0,0,0,0.8);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .gauge-center {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      border: 2px solid #555;
      position: relative;
      background: #151515;
    }

    .gauge-title {
      position: absolute;
      bottom: 20px;
      width: 100%;
      text-align: center;
      font-size: 11px;
      color: #aaa;
      letter-spacing: 1px;
    }

    .gauge-value {
      position: absolute;
      bottom: 35px;
      width: 100%;
      text-align: center;
      font-size: 13px;
      color: #00ffcc;
      text-shadow: 0 0 5px #00ffcc;
    }

    .needle {
      position: absolute;
      bottom: 50%;
      left: calc(50% - 2px);
      width: 4px;
      height: 38px;
      background: #ff3333;
      border-radius: 2px;
      transform-origin: bottom center;
      transform: rotate(-120deg);
      transition: transform 0.1s ease-out;
      box-shadow: 0 0 4px #ff0000;
    }

    .needle::after {
      content: '';
      position: absolute;
      bottom: -4px;
      left: -3px;
      width: 10px;
      height: 10px;
      background: #888;
      border-radius: 50%;
    }

    /* Small center fuel gauge */
    .fuel-gauge {
      width: 90px;
      height: 90px;
    }
    .fuel-gauge .needle {
      height: 30px;
    }

    /* Pedals */
    .pedal {
      position: absolute;
      bottom: 20px;
      width: 90px;
      height: 140px;
      background: linear-gradient(135deg, #444 0%, #222 100%);
      border: 4px solid #666;
      border-radius: 18px;
      box-shadow: 0 8px 15px rgba(0,0,0,0.7), inset 0 2px 5px rgba(255,255,255,0.2);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      z-index: 20;
      touch-action: manipulation;
    }

    .pedal:active, .pedal.active {
      transform: translateY(6px);
      box-shadow: 0 2px 5px rgba(0,0,0,0.7);
      background: linear-gradient(135deg, #333 0%, #111 100%);
    }

    .pedal-brake {
      left: 25px;
      border-color: #e74c3c;
    }

    .pedal-gas {
      right: 25px;
      border-color: #2ecc71;
    }

    .pedal-grip {
      width: 70%;
      height: 10px;
      background: #111;
      margin: 4px 0;
      border-radius: 4px;
      box-shadow: inset 0 1px 2px #000;
    }

    .pedal-label {
      color: #fff;
      font-size: 14px;
      margin-top: 8px;
      text-shadow: 1px 1px 2px #000;
    }

    /* Game Over Modal */
    #game-over-modal {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
      color: #fff;
    }

    #game-over-modal h1 {
      font-size: 48px;
      color: #ff3333;
      text-shadow: 3px 3px 0 #000;
      margin-bottom: 10px;
    }

    #game-over-reason {
      font-size: 20px;
      color: #ffcc00;
      margin-bottom: 25px;
    }

    .restart-btn {
      padding: 15px 40px;
      font-size: 24px;
      font-family: inherit;
      background: #2ecc71;
      color: #fff;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 6px 0 #27ae60;
      transition: all 0.1s;
    }

    .restart-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #27ae60;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <!-- Top Bar -->
    <div class="top-bar">
      <div class="distance-badge">Quãng đường: <span id="dist-val">0</span> m</div>
    </div>

    <!-- Dashboard Gauges -->
    <div class="dashboard">
      <!-- RPM Gauge -->
      <div class="gauge-container">
        <div class="gauge-center">
          <div class="needle" id="rpm-needle"></div>
          <div class="gauge-value" id="rpm-val">0</div>
          <div class="gauge-title">RPM</div>
        </div>
      </div>

      <!-- Fuel Gauge (45 Seconds System) -->
      <div class="gauge-container fuel-gauge">
        <div class="gauge-center">
          <div class="needle" id="fuel-needle"></div>
          <div class="gauge-value" id="fuel-val" style="color:#2ecc71">100%</div>
          <div class="gauge-title">FUEL</div>
        </div>
      </div>

      <!-- Speed Gauge -->
      <div class="gauge-container">
        <div class="gauge-center">
          <div class="needle" id="speed-needle"></div>
          <div class="gauge-value" id="speed-val">0</div>
          <div class="gauge-title">SPEED</div>
        </div>
      </div>
    </div>

    <!-- Controls -->
    <div class="pedal pedal-brake" id="btn-brake">
      <div class="pedal-grip"></div>
      <div class="pedal-grip"></div>
      <div class="pedal-grip"></div>
      <div class="pedal-label">LÙI / PHANH</div>
    </div>

    <div class="pedal pedal-gas" id="btn-gas">
      <div class="pedal-grip"></div>
      <div class="pedal-grip"></div>
      <div class="pedal-grip"></div>
      <div class="pedal-label">GA</div>
    </div>

    <!-- Game Over Screen -->
    <div id="game-over-modal">
      <h1>GAME OVER!</h1>
      <div id="game-over-reason">Lật xe chạm đầu!</div>
      <button class="restart-btn" onclick="restartGame()">THỬ LẠI</button>
    </div>
  </div>

  <script>
    const { Engine, Render, Runner, Bodies, Composite, Constraint, Vector, Body, Events } = Matter;

    // Game variables
    const FUEL_MAX_TIME = 45; // Exactly 45 seconds fuel duration
    let fuelTimeLeft = FUEL_MAX_TIME;
    let distance = 0;
    let isGameOver = false;
    let gasPressed = false;
    let brakePressed = false;

    // Setup Matter.js Engine
    const container = document.getElementById('game-container');
    const engine = Engine.create({ enableSleeping: false });
    engine.world.gravity.y = 1.2;

    const render = Render.create({
      element: container,
      engine: engine,
      options: {
        width: window.innerWidth,
        height: window.innerHeight,
        wireframes: false,
        background: '#87CEEB'
      }
    });

    Render.run(render);
    const runner = Runner.create();
    Runner.run(runner, engine);

    // Terrain Generation
    const terrainSegments = [];
    const segmentWidth = 60;
    let lastX = -200;
    let lastY = window.innerHeight * 0.65;

    function generateTerrain(toX) {
      while (lastX < toX) {
        let nextX = lastX + segmentWidth;
        let nextY = lastY + (Math.sin(lastX * 0.008) * 35) + (Math.cos(lastX * 0.02) * 20);
        
        let ground = Bodies.rectangle(
          (lastX + nextX) / 2,
          (lastY + nextY) / 2 + 20,
          segmentWidth + 10,
          80,
          {
            isStatic: true,
            friction: 0.9,
            render: { fillStyle: '#4d8a27' }
          }
        );
        
        // Calculate ground angle
        const angle = Math.atan2(nextY - lastY, nextX - lastX);
        Body.setAngle(ground, angle);

        Composite.add(engine.world, ground);
        terrainSegments.push(ground);

        lastX = nextX;
        lastY = nextY;
      }
    }

    // Vehicle & Driver Creation
    let car, rearWheel, frontWheel, driverHead, nameBadge;

    function createVehicle(startX, startY) {
      // Chassis
      car = Bodies.rectangle(startX, startY, 130, 40, {
        density: 0.004,
        friction: 0.8,
        restitution: 0.1,
        collisionFilter: { group: -1 },
        render: { fillStyle: '#2980b9' }
      });

      // Driver Head (Defeat Trigger)
      driverHead = Bodies.circle(startX - 10, startY - 35, 16, {
        density: 0.001,
        collisionFilter: { group: -1 },
        render: { fillStyle: '#f39c12' }
      });

      // Joint attaching head to car body
      const neckJoint = Constraint.create({
        bodyA: car,
        bodyB: driverHead,
        pointA: { x: -10, y: -30 },
        pointB: { x: 0, y: 0 },
        stiffness: 0.8,
        length: 0,
        render: { visible: false }
      });

      // Wheels
      const wheelOptions = {
        friction: 1.0,
        density: 0.005,
        restitution: 0.2,
        collisionFilter: { group: -1 },
        render: { fillStyle: '#222', strokeStyle: '#555', lineWidth: 6 }
      };

      rearWheel = Bodies.circle(startX - 45, startY + 25, 24, wheelOptions);
      frontWheel = Bodies.circle(startX + 45, startY + 25, 24, wheelOptions);

      // Suspension Constraints
      const rearAxle = Constraint.create({
        bodyA: car,
        bodyB: rearWheel,
        pointA: { x: -45, y: 20 },
        stiffness: 0.2,
        damping: 0.05,
        render: { strokeStyle: '#333', lineWidth: 4 }
      });

      const frontAxle = Constraint.create({
        bodyA: car,
        bodyB: frontWheel,
        pointA: { x: 45, y: 20 },
        stiffness: 0.2,
        damping: 0.05,
        render: { strokeStyle: '#333', lineWidth: 4 }
      });

      Composite.add(engine.world, [car, driverHead, neckJoint, rearWheel, frontWheel, rearAxle, frontAxle]);
    }

    // Initial setup
    generateTerrain(window.innerWidth + 1000);
    createVehicle(100, lastY - 150);

    // Custom Canvas Rendering for Driver Cap, Buggy Frame, & Name Badge
    Events.on(render, 'afterRender', () => {
      const ctx = render.context;

      // 1. Draw Name Tag above car ("Toansigma")
      if (car) {
        ctx.save();
        ctx.translate(car.position.x, car.position.y - 75);
        ctx.fillStyle = '#e74c3c';
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.font = 'bold 15px Arial';
        const text = "Toansigma";
        const width = ctx.measureText(text).width + 16;
        ctx.fillRect(-width/2, -12, width, 24);
        ctx.strokeRect(-width/2, -12, width, 24);
        ctx.fillStyle = '#fff';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(text, 0, 0);
        ctx.restore();

        // 2. Draw Driver Red Cap & Beard
        ctx.save();
        ctx.translate(driverHead.position.x, driverHead.position.y);
        ctx.rotate(driverHead.angle);
        
        // Red Cap
        ctx.fillStyle = '#c0392b';
        ctx.beginPath();
        ctx.arc(0, -3, 17, Math.PI, 0);
        ctx.fill();
        // Cap Visor
        ctx.fillRect(5, -6, 16, 5);

        // Beard
        ctx.fillStyle = '#7f8c8d';
        ctx.beginPath();
        ctx.arc(4, 6, 10, 0, Math.PI / 2);
        ctx.fill();
        ctx.restore();

        // 3. Draw Dune Buggy Roll Cage & Flag
        ctx.save();
        ctx.translate(car.position.x, car.position.y);
        ctx.rotate(car.angle);

        // Buggy Frame
        ctx.strokeStyle = '#ecf0f1';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(-50, -10);
        ctx.lineTo(-20, -45);
        ctx.lineTo(20, -45);
        ctx.lineTo(50, -10);
        ctx.stroke();

        // Rear Exhaust
        ctx.fillStyle = '#7f8c8d';
        ctx.fillRect(-70, -10, 20, 8);

        // Rear Flag Pole
        ctx.strokeStyle = '#333';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-60, -10);
        ctx.lineTo(-60, -55);
        ctx.stroke();
        // Flag
        ctx.fillStyle = '#e74c3c';
        ctx.beginPath();
        ctx.moveTo(-60, -55);
        ctx.lineTo(-40, -48);
        ctx.lineTo(-60, -40);
        ctx.fill();

        ctx.restore();
      }
    });

    // Camera follow
    Events.on(render, 'beforeRender', () => {
      if (!car) return;
      
      const targetX = -car.position.x + window.innerWidth * 0.35;
      const targetY = -car.position.y + window.innerHeight * 0.55;

      Render.lookAt(render, {
        min: { x: car.position.x - window.innerWidth * 0.35, y: car.position.y - window.innerHeight * 0.55 },
        max: { x: car.position.x + window.innerWidth * 0.65, y: car.position.y + window.innerHeight * 0.45 }
      });

      // Expand terrain as player moves forward
      if (car.position.x + window.innerWidth > lastX) {
        generateTerrain(car.position.x + window.innerWidth + 800);
      }
    });

    // Game Physics & Driving Loop
    let lastTimestamp = performance.now();

    Events.on(engine, 'beforeUpdate', () => {
      if (isGameOver) return;

      const now = performance.now();
      const delta = (now - lastTimestamp) / 1000;
      lastTimestamp = now;

      // 1. Drain Fuel (Reaches 0 in exactly 45 seconds)
      fuelTimeLeft = Math.max(0, fuelTimeLeft - delta);
      const fuelPercent = Math.floor((fuelTimeLeft / FUEL_MAX_TIME) * 100);

      // Update Fuel UI
      document.getElementById('fuel-val').innerText = fuelPercent + '%';
      document.getElementById('fuel-needle').style.transform = `rotate(${-120 + (fuelPercent / 100) * 240}deg)`;
      
      if (fuelPercent < 20) {
        document.getElementById('fuel-val').style.color = '#e74c3c';
      } else {
        document.getElementById('fuel-val').style.color = '#2ecc71';
      }

      if (fuelTimeLeft <= 0) {
        triggerGameOver("Hết nhiên liệu!");
        return;
      }

      // 2. Driving Logic
      const speed = Body.getVelocity(car).x;
      let rpm = Math.abs(speed) * 150;

      if (gasPressed) {
        Body.setAngularVelocity(rearWheel, 0.3);
        Body.setAngularVelocity(frontWheel, 0.3);
        Body.applyForce(car, car.position, { x: 0.002, y: 0 });
        rpm += 1200;
      } else if (brakePressed) {
        Body.setAngularVelocity(rearWheel, -0.2);
        Body.setAngularVelocity(frontWheel, -0.2);
        Body.applyForce(car, car.position, { x: -0.0015, y: 0 });
        rpm += 800;
      }

      // 3. Update Dash Gauges
      const displaySpeed = Math.max(0, Math.floor(speed * 3.6));
      document.getElementById('speed-val').innerText = displaySpeed;
      document.getElementById('speed-needle').style.transform = `rotate(${-120 + Math.min(240, displaySpeed * 3)}deg)`;

      const displayRpm = Math.floor(Math.min(8000, rpm));
      document.getElementById('rpm-val').innerText = displayRpm;
      document.getElementById('rpm-needle').style.transform = `rotate(${-120 + (displayRpm / 8000) * 240}deg)`;

      // 4. Update Distance
      distance = Math.max(distance, Math.floor((car.position.x - 100) / 10));
      document.getElementById('dist-val').innerText = distance;
    });

    // Collision Detection for Driver Head Impact
    Events.on(engine, 'collisionStart', (event) => {
      if (isGameOver) return;
      
      event.pairs.forEach(pair => {
        const { bodyA, bodyB } = pair;
        const isHeadInvolved = (bodyA === driverHead || bodyB === driverHead);
        const isGroundInvolved = terrainSegments.includes(bodyA) || terrainSegments.includes(bodyB);

        if (isHeadInvolved && isGroundInvolved) {
          triggerGameOver("Lật xe chạm đầu!");
        }
      });
    });

    // Game Over Trigger
    function triggerGameOver(reason) {
      if (isGameOver) return;
      isGameOver = true;
      document.getElementById('game-over-reason').innerText = reason;
      document.getElementById('game-over-modal').style.display = 'flex';
    }

    // Restart Game
    function restartGame() {
      location.reload();
    }

    // Controls Handling (Touch, Mouse, Keyboard)
    const btnGas = document.getElementById('btn-gas');
    const btnBrake = document.getElementById('btn-brake');

    const bindControl = (element, onPress, onRelease) => {
      element.addEventListener('mousedown', onPress);
      element.addEventListener('mouseup', onRelease);
      element.addEventListener('mouseleave', onRelease);
      element.addEventListener('touchstart', (e) => { e.preventDefault(); onPress(); });
      element.addEventListener('touchend', (e) => { e.preventDefault(); onRelease(); });
    };

    bindControl(btnGas, () => { gasPressed = true; btnGas.classList.add('active'); }, () => { gasPressed = false; btnGas.classList.remove('active'); });
    bindControl(btnBrake, () => { brakePressed = true; btnBrake.classList.add('active'); }, () => { brakePressed = false; btnBrake.classList.remove('active'); });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === 'd') { gasPressed = true; btnGas.classList.add('active'); }
      if (e.key === 'ArrowLeft' || e.key === 'a') { brakePressed = true; btnBrake.classList.add('active'); }
    });

    window.addEventListener('keyup', (e) => {
      if (e.key === 'ArrowRight' || e.key === 'd') { gasPressed = false; btnGas.classList.remove('active'); }
      if (e.key === 'ArrowLeft' || e.key === 'a') { brakePressed = false; btnBrake.classList.remove('active'); }
    });

    // Resize Handling
    window.addEventListener('resize', () => {
      render.canvas.width = window.innerWidth;
      render.canvas.height = window.innerHeight;
    });
  </script>
</body>
</html>
