<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Đào Vàng Cổ Điển</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #1a1a1a;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    #game-container {
      position: relative;
      width: 800px;
      height: 600px;
      border: 4px solid #8b4513;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 10px 20px rgba(0,0,0,0.5);
    }
    canvas {
      display: block;
      background: linear-gradient(to bottom, #87ceeb 0%, #87ceeb 20%, #d2b48c 20%, #8b4513 100%);
    }
    #ui {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      font-size: 20px;
      font-weight: bold;
      color: #000;
      text-shadow: 1px 1px 2px #fff;
      pointer-events: none;
    }
    #controls {
      margin-top: 15px;
      text-align: center;
    }
    .btn {
      padding: 10px 20px;
      font-size: 16px;
      font-weight: bold;
      background-color: #f39c12;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover {
      background-color: #d35400;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <div id="ui">
      <div id="score-display">Điểm: 0</div>
      <div id="target-display">Mục tiêu: 1000</div>
      <div id="timer-display">Thời gian: 60s</div>
    </div>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
  </div>

  <div id="controls">
    <button class="btn" id="start-btn" onclick="startGame()">Bắt đầu / Chơi lại</button>
    <p style="margin-top: 8px; color: #aaa;">Nhấn <b>Phím Mũi Tên Xuống (↓)</b> hoặc <b>Phím Cách (Space)</b> để thả móc!</p>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // UI Elements
    const scoreEl = document.getElementById('score-display');
    const targetEl = document.getElementById('target-display');
    const timerEl = document.getElementById('timer-display');

    // Cấu hình Game
    let score = 0;
    let targetScore = 1000;
    let timeLeft = 60;
    let gameInterval = null;
    let timerInterval = null;
    let isGameOver = false;

    // Trục kéo (Miner Hook)
    const miner = {
      x: canvas.width / 2,
      y: 100,
      angle: 0,
      angleSpeed: 0.03,
      angleDir: 1,
      length: 40,
      maxLength: 650,
      status: 'swing', // 'swing', 'shoot', 'retract'
      speed: 10,
      caughtItem: null
    };

    // Danh sách vật phẩm
    let items = [];

    class Item {
      constructor(x, y, radius, type, value, weight, color) {
        this.x = x;
        this.y = y;
        this.radius = radius;
        this.type = type; // 'gold', 'rock'
        this.value = value;
        this.weight = weight; // Càng nặng kéo càng chậm
        this.color = color;
      }

      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#000';
        ctx.stroke();

        // Thêm ánh kim cho vàng
        if (this.type === 'gold') {
          ctx.beginPath();
          ctx.arc(this.x - this.radius / 3, this.y - this.radius / 3, this.radius / 4, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
          ctx.fill();
        }
      }
    }

    // Khởi tạo các vật phẩm ngẫu nhiên
    function createItems() {
      items = [];
      // Vàng nhỏ
      for (let i = 0; i < 5; i++) {
        items.push(new Item(
          Math.random() * (canvas.width - 100) + 50,
          Math.random() * 300 + 200,
          15, 'gold', 250, 2, '#ffd700'
        ));
      }
      // Vàng lớn
      for (let i = 0; i < 3; i++) {
        items.push(new Item(
          Math.random() * (canvas.width - 120) + 60,
          Math.random() * 250 + 250,
          30, 'gold', 500, 5, '#ffb700'
        ));
      }
      // Đá
      for (let i = 0; i < 4; i++) {
        items.push(new Item(
          Math.random() * (canvas.width - 100) + 50,
          Math.random() * 300 + 200,
          25, 'rock', 50, 7, '#808080'
        ));
      }
    }

    // Vẽ ông lão đào vàng
    function drawMiner() {
      ctx.fillStyle = '#d35400';
      ctx.fillRect(miner.x - 20, miner.y - 40, 40, 40);
      ctx.fillStyle = '#f1c40f';
      ctx.beginPath();
      ctx.arc(miner.x, miner.y - 45, 15, 0, Math.PI * 2);
      ctx.fill();
    }

    // Vẽ dây và móc
    function drawHook() {
      const hookX = miner.x + Math.sin(miner.angle) * miner.length;
      const hookY = miner.y + Math.cos(miner.angle) * miner.length;

      // Vẽ dây
      ctx.beginPath();
      ctx.moveTo(miner.x, miner.y);
      ctx.lineTo(hookX, hookY);
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 3;
      ctx.stroke();

      // Vẽ móc
      ctx.beginPath();
      ctx.arc(hookX, hookY, 8, 0, Math.PI * 2);
      ctx.fillStyle = '#555';
      ctx.fill();

      // Giữ vật phẩm khi kéo về
      if (miner.caughtItem) {
        miner.caughtItem.x = hookX;
        miner.caughtItem.y = hookY + miner.caughtItem.radius;
      }
    }

    // Cập nhật trạng thái móc
    function updateHook() {
      if (miner.status === 'swing') {
        miner.angle += miner.angleSpeed * miner.angleDir;
        if (miner.angle > 1.2 || miner.angle < -1.2) {
          miner.angleDir *= -1;
        }
      } else if (miner.status === 'shoot') {
        miner.length += miner.speed;
        const hookX = miner.x + Math.sin(miner.angle) * miner.length;
        const hookY = miner.y + Math.cos(miner.angle) * miner.length;

        // Va chạm biên
        if (hookX < 0 || hookX > canvas.width || hookY > canvas.height || miner.length >= miner.maxLength) {
          miner.status = 'retract';
        }

        // Va chạm vật phẩm
        for (let i = 0; i < items.length; i++) {
          const item = items[i];
          const dist = Math.hypot(hookX - item.x, hookY - item.y);
          if (dist < item.radius) {
            miner.caughtItem = item;
            items.splice(i, 1);
            miner.status = 'retract';
            break;
          }
        }
      } else if (miner.status === 'retract') {
        const currentSpeed = miner.caughtItem ? miner.speed / miner.caughtItem.weight : miner.speed;
        miner.length -= currentSpeed;

        if (miner.length <= 40) {
          miner.length = 40;
          miner.status = 'swing';
          if (miner.caughtItem) {
            score += miner.caughtItem.value;
            scoreEl.textContent = `Điểm: ${score}`;
            miner.caughtItem = null;
          }
        }
      }
    }

    // Vẽ toàn bộ Game
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Thảm cỏ
      ctx.fillStyle = '#2ecc71';
      ctx.fillRect(0, 115, canvas.width, 10);

      drawMiner();
      drawHook();

      // Vẽ vật phẩm
      items.forEach(item => item.draw());

      if (miner.caughtItem) {
        miner.caughtItem.draw();
      }
    }

    // Bắt sự kiện thả móc
    window.addEventListener('keydown', (e) => {
      if ((e.code === 'Space' || e.code === 'ArrowDown') && miner.status === 'swing' && !isGameOver) {
        miner.status = 'shoot';
      }
    });

    // Vòng lặp chính
    function gameLoop() {
      updateHook();
      draw();
      if (!isGameOver) {
        requestAnimationFrame(gameLoop);
      }
    }

    // Khai cuộc
    function startGame() {
      score = 0;
      timeLeft = 60;
      isGameOver = false;
      miner.status = 'swing';
      miner.length = 40;
      miner.caughtItem = null;

      scoreEl.textContent = `Điểm: ${score}`;
      targetEl.textContent = `Mục tiêu: ${targetScore}`;
      timerEl.textContent = `Thời gian: ${timeLeft}s`;

      createItems();

      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        timeLeft--;
        timerEl.textContent = `Thời gian: ${timeLeft}s`;

        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          isGameOver = true;
          if (score >= targetScore) {
            alert(`Chúc mừng! Bạn đã thắng với ${score} điểm!`);
          } else {
            alert(`Rất tiếc! Bạn thua rồi. Số điểm đạt được: ${score}/${targetScore}`);
          }
        }
      }, 1000);

      gameLoop();
    }
  </script>
</body>
</html>
