<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Angry Birds Mini - Multi Birds & Skills</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #111;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 1400px;
            max-height: 750px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            color: white;
            text-align: center;
            padding: 20px;
            backdrop-filter: blur(5px);
        }
        
        #welcomeScreen {
            background: linear-gradient(135deg, #1b4332, #2d6a4f, #40916c);
        }

        .overlay h1 {
            font-size: 58px;
            margin: 0 0 25px 0;
            color: #ffcc00;
            text-shadow: 4px 4px 0px #ff3333, 6px 6px 20px rgba(0,0,0,0.8);
            letter-spacing: 2px;
        }
        .btn {
            padding: 16px 50px;
            font-size: 22px;
            font-weight: bold;
            background: linear-gradient(to bottom, #8ddb44, #558822);
            color: #fff;
            border: 2px solid #335511;
            border-radius: 35px;
            cursor: pointer;
            box-shadow: 0 6px 0 #335511, 0 10px 20px rgba(0,0,0,0.4);
            transition: 0.1s;
            margin: 8px;
        }
        .btn:hover {
            background: linear-gradient(to bottom, #9ee85c, #669922);
        }
        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #335511, 0 5px 10px rgba(0,0,0,0.4);
        }
        .btn.locked {
            background: linear-gradient(to bottom, #777, #444);
            border-color: #222;
            box-shadow: 0 6px 0 #222;
            cursor: not-allowed;
            opacity: 0.6;
        }
        .hidden {
            display: none !important;
        }
        
        .input-group {
            margin: 12px 0;
            text-align: left;
            width: 300px;
        }
        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #ffcc00;
        }
        .input-group input {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 2px solid #558822;
            background: #222;
            color: white;
            font-size: 16px;
        }
        .avatar-upload {
            display: flex;
            align-items: center;
            gap: 15px;
            margin: 15px 0;
        }
        .avatar-preview {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 2px solid #ffcc00;
            object-fit: cover;
            background: #333;
        }

        #gearBtn {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 300;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid rgba(255, 255, 255, 0.7);
            color: #fff;
            width: 50px;
            height: 50px;
            font-size: 26px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(4px);
            transition: 0.2s;
        }
        #gearBtn:hover {
            background: rgba(0, 0, 0, 0.9);
            border-color: #ffcc00;
            transform: rotate(45deg);
        }

        #logoutBtn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            padding: 8px 20px;
            font-size: 14px;
            background: linear-gradient(to bottom, #ff4444, #cc0000);
            border: 2px solid #990000;
            box-shadow: 0 4px 0 #990000;
            border-radius: 20px;
            color: white;
            cursor: pointer;
            font-weight: bold;
            z-index: 250;
        }
        #logoutBtn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #990000;
        }

        #settingsModal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 400;
            backdrop-filter: blur(6px);
        }
        .settings-content {
            background: #222;
            border: 3px solid #558822;
            padding: 30px;
            border-radius: 20px;
            width: 350px;
            text-align: center;
            color: white;
            box-shadow: 0 10px 25px rgba(0,0,0,0.9);
        }
        .settings-content h2 {
            margin-top: 0;
            color: #ffcc00;
        }
        .setting-group {
            margin: 20px 0;
            text-align: left;
        }
        .setting-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        .setting-group select, .setting-group input[type="range"] {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: none;
            background: #333;
            color: white;
            font-size: 16px;
        }
        .close-btn {
            background: #ff3333;
            color: white;
            border: none;
            padding: 10px 25px;
            font-size: 18px;
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }
        .close-btn:hover { background: #ff1a1a; }

        #userInfoPanel {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 250;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid rgba(255, 255, 255, 0.4);
            padding: 8px 15px;
            border-radius: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: white;
            backdrop-filter: blur(4px);
        }
        #userInfoPanel img {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            border: 1px solid #ffcc00;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <div id="gameContainer">
        <button id="gearBtn" onclick="openSettings()">⚙️</button>

        <div id="userInfoPanel" class="hidden">
            <img id="panelAvatar" src="" alt="Avatar">
            <span id="panelUsername" style="font-weight: bold;">User</span>
        </div>

        <div id="welcomeScreen" class="overlay">
            <h1>ANGRY BIRDS MINI</h1>
            <button class="btn" style="font-size: 26px; padding: 18px 55px;" onclick="goToAuthScreen()">PLAY</button>
            <div style="font-size: 14px; color: #e0e0e0; margin-top: 15px; font-style: italic; text-shadow: 1px 1px 2px rgba(0,0,0,0.8);">* Đăng nhập để lưu tiến trình chơi của bạn</div>
        </div>

        <div id="authScreen" class="overlay hidden">
            <h1>ĐĂNG NHẬP</h1>
            
            <div class="input-group">
                <label>Tên tài khoản:</label>
                <input type="text" id="usernameInput" placeholder="Nhập tên của bạn...">
            </div>
            
            <div class="input-group">
                <label>Mật khẩu:</label>
                <input type="password" id="passwordInput" placeholder="Nhập mật khẩu...">
            </div>

            <div class="avatar-upload">
                <img id="avatarPreview" class="avatar-preview" src="" alt="Preview">
                <div>
                    <label style="display:block; margin-bottom:5px; font-weight:bold; color:#ffcc00; text-align:left;">Ảnh Đại Diện:</label>
                    <input type="file" id="avatarFile" accept="image/*" onchange="previewAvatar(event)" style="color: #ccc; font-size: 14px;">
                </div>
            </div>

            <button class="btn" onclick="handleLogin()">VÀO GAME</button>
        </div>

        <div id="levelMenuScreen" class="overlay hidden">
            <h1>CHỌN MÀN CHƠI</h1>
            <p id="welcomeUserText">Xin chào!</p>
            <div style="display: flex; gap: 15px; flex-wrap: wrap; justify-content: center; margin-bottom: 25px;">
                <button class="btn" id="lvlBtn1" style="padding: 15px 25px;" onclick="startLevel(1)">Màn 1</button>
                <button class="btn locked" id="lvlBtn2" style="padding: 15px 25px;" onclick="startLevel(2)">Màn 2 🔒</button>
                <button class="btn locked" id="lvlBtn3" style="padding: 15px 25px;" onclick="startLevel(3)">Màn 3 🔒</button>
                <button class="btn locked" id="lvlBtn4" style="padding: 15px 25px;" onclick="startLevel(4)">Màn 4 🔒</button>
                <button class="btn locked" id="lvlBtn5" style="padding: 15px 25px;" onclick="startLevel(5)">Màn 5 🔒</button>
            </div>
            <button id="logoutBtn" onclick="logout()">Đăng Xuất</button>
        </div>

        <div id="settingsModal" class="hidden">
            <div class="settings-content">
                <h2>CÀI ĐẶT ÂM THANH</h2>
                
                <div class="setting-group">
                    <label>Chọn Nhạc Nền:</label>
                    <select id="bgMusicSelect" onchange="changeBackgroundMusic()">
                        <option value="angrybird.sound2.mp4" selected>Nhạc 2 (angrybird.sound2.mp4)</option>
                        <option value="angrybird.sound.mp4">Nhạc 1 (angrybird.sound.mp4)</option>
                    </select>
                </div>

                <div class="setting-group">
                    <label>Âm lượng: <span id="volumeValue">50</span>%</label>
                    <input type="range" id="volumeSlider" min="0" max="100" value="50" oninput="updateVolume(this.value)">
                </div>

                <div class="setting-group" style="display: flex; gap: 10px;">
                    <button class="btn" style="flex:1; padding: 10px; font-size: 16px; margin:0;" onclick="toggleMute()" id="muteBtn">Tắt Nhạc</button>
                </div>

                <button class="close-btn" onclick="closeSettings()">Đóng</button>
            </div>
        </div>

        <div id="gameOverScreen" class="overlay hidden">
            <h1 id="gameOverTitle">CHIẾN THẮNG!</h1>
            <p id="finalScoreText">Tổng điểm tuyệt đối: 0</p>
            <div style="display: flex; gap: 15px;">
                <button class="btn" onclick="startLevel(currentLevel)">CHƠI LẠI</button>
                <button class="btn" style="background: #3388ff; border-color: #1155cc;" onclick="returnToLevelMenu()">CHỌN MÀN</button>
            </div>
        </div>

        <canvas id="gameCanvas"></canvas>
    </div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const welcomeScreen = document.getElementById("welcomeScreen");
const authScreen = document.getElementById("authScreen");
const levelMenuScreen = document.getElementById("levelMenuScreen");
const gameOverScreen = document.getElementById("gameOverScreen");
const gameOverTitle = document.getElementById("gameOverTitle");
const finalScoreText = document.getElementById("finalScoreText");
const settingsModal = document.getElementById("settingsModal");
const volumeSlider = document.getElementById("volumeSlider");
const volumeValue = document.getElementById("volumeValue");
const muteBtn = document.getElementById("muteBtn");
const bgMusicSelect = document.getElementById("bgMusicSelect");
const userInfoPanel = document.getElementById("userInfoPanel");
const panelAvatar = document.getElementById("panelAvatar");
const panelUsername = document.getElementById("panelUsername");
const welcomeUserText = document.getElementById("welcomeUserText");

let currentUser = { username: "", password: "", avatar: "", maxLevelUnlocked: 1 };

window.onload = function() {
    let savedUser = localStorage.getItem("angryBirdsUser");
    if (savedUser) {
        currentUser = JSON.parse(savedUser);
        if (!currentUser.maxLevelUnlocked) currentUser.maxLevelUnlocked = 1;
        
        panelUsername.textContent = currentUser.username;
        if (currentUser.avatar) panelAvatar.src = currentUser.avatar;
        userInfoPanel.classList.remove("hidden");
        welcomeScreen.classList.add("hidden");
        levelMenuScreen.classList.remove("hidden");
        welcomeUserText.textContent = `Xin chào, ${currentUser.username}! Hãy chọn màn chơi:`;
        updateLevelButtons();
    }
}

function goToAuthScreen() {
    welcomeScreen.classList.add("hidden");
    authScreen.classList.remove("hidden");
}

let tempAvatarBase64 = "";
function previewAvatar(event) {
    const file = event.target.files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
            tempAvatarBase64 = e.target.result;
            document.getElementById("avatarPreview").src = tempAvatarBase64;
        }
        reader.readAsDataURL(file);
    }
}

function handleLogin() {
    let username = document.getElementById("usernameInput").value.trim();
    let password = document.getElementById("passwordInput").value.trim();
    if (!username || !password) {
        alert("Vui lòng nhập đầy đủ tên tài khoản và mật khẩu!");
        return;
    }

    let allUsers = JSON.parse(localStorage.getItem("angryBirdsAllUsers") || "{}");
    if (allUsers[username] && allUsers[username] !== password) {
        alert("Tên tài khoản này đã có, vui lòng nhập tên khác!");
        return;
    }

    allUsers[username] = password;
    localStorage.setItem("angryBirdsAllUsers", JSON.stringify(allUsers));

    currentUser.username = username;
    currentUser.password = password;
    if (tempAvatarBase64) currentUser.avatar = tempAvatarBase64;
    if (!currentUser.maxLevelUnlocked) currentUser.maxLevelUnlocked = 1;

    localStorage.setItem("angryBirdsUser", JSON.stringify(currentUser));

    panelUsername.textContent = currentUser.username;
    if (currentUser.avatar) panelAvatar.src = currentUser.avatar;
    userInfoPanel.classList.remove("hidden");

    authScreen.classList.add("hidden");
    levelMenuScreen.classList.remove("hidden");
    welcomeUserText.textContent = `Xin chào, ${currentUser.username}! Hãy chọn màn chơi:`;
    updateLevelButtons();
}

function logout() {
    localStorage.removeItem("angryBirdsUser");
    location.reload();
}

function returnToLevelMenu() {
    gameOverScreen.classList.add("hidden");
    levelMenuScreen.classList.remove("hidden");
    gameState = "MENU";
    updateLevelButtons();
}

function updateLevelButtons() {
    for (let i = 1; i <= 5; i++) {
        let btn = document.getElementById(`lvlBtn${i}`);
        if (i <= currentUser.maxLevelUnlocked) {
            btn.classList.remove("locked");
            btn.textContent = `Màn ${i}`;
        } else {
            btn.classList.add("locked");
            btn.textContent = `Màn ${i} 🔒`;
        }
    }
}

let currentMusicFile = "angrybird.sound2.mp4";
let bgMusic = new Audio(currentMusicFile);
bgMusic.loop = true;
bgMusic.volume = 0.5;

const victorySound = new Audio("victorysound.mp4");
victorySound.volume = 0.7;

let isMuted = false;

function openSettings() { settingsModal.classList.remove("hidden"); }
function closeSettings() { settingsModal.classList.add("hidden"); }

function changeBackgroundMusic() {
    let selectedFile = bgMusicSelect.value;
    bgMusic.pause();
    currentMusicFile = selectedFile;
    bgMusic = new Audio(currentMusicFile);
    bgMusic.loop = true;
    bgMusic.volume = volumeSlider.value / 100;
    if (!isMuted && gameState === "PLAYING") {
        bgMusic.play().catch(e => console.log(e));
    }
}

function updateVolume(val) {
    volumeValue.textContent = val;
    let vol = val / 100;
    bgMusic.volume = vol;
    victorySound.volume = vol;
    if (val > 0 && isMuted) {
        isMuted = false;
        muteBtn.textContent = "Tắt Nhạc";
        muteBtn.style.background = "linear-gradient(to bottom, #8ddb44, #558822)";
    }
}

function toggleMute() {
    isMuted = !isMuted;
    if (isMuted) {
        bgMusic.pause();
        victorySound.pause();
        muteBtn.textContent = "Bật Nhạc";
        muteBtn.style.background = "#ff3333";
    } else {
        muteBtn.textContent = "Tắt Nhạc";
        muteBtn.style.background = "linear-gradient(to bottom, #8ddb44, #558822)";
        if (gameState === "PLAYING") {
            bgMusic.play().catch(e => console.log(e));
        }
    }
}

let gameState = "MENU"; 
let currentLevel = 1;
let score = 0;
let lives = 3;
let groundY = 0;
let scale = 1;

let sling = { x: 0, y: 0 };

const birdTypes = ["red", "yellow", "blue", "black"];
let currentBirdIndex = 0;

let bird = { 
    x: 0, y: 0, radius: 22, vx: 0, vy: 0, 
    isDragging: false, isLaunched: false, 
    type: "red", skillUsed: false 
};

let subBirds = []; 
let targets = [];
let groundHills = [];

function resizeCanvas() {
    canvas.width = canvas.parentElement.clientWidth;
    canvas.height = canvas.parentElement.clientHeight;

    let scaleX = canvas.width / 1400;
    let scaleY = canvas.height / 650;
    scale = Math.min(scaleX, scaleY);
    if (scale < 0.6) scale = 0.6;

    groundY = canvas.height - 200 * scale;
    sling.x = canvas.width * 0.15;
    sling.y = groundY - 90 * scale;

    if (!bird.isLaunched && !bird.isDragging) {
        bird.x = sling.x;
        bird.y = sling.y;
    }

    bird.radius = 22 * scale;

    groundHills = [
        { x: canvas.width * 0.58, w: 320 * scale, h: 55 * scale },
        { x: canvas.width * 0.82, w: 260 * scale, h: 75 * scale }
    ];
}

function loadLevel(lvl) {
    currentLevel = lvl;
    resizeCanvas();
    currentBirdIndex = 0;
    const startX = canvas.width * 0.65;
    
    const longW = 120 * scale;
    const longThinH = 18 * scale; 
    const blockW = 48 * scale;
    const blockH = 70 * scale;

    if (lvl === 1) {
        targets = [
            { type: "wood", x: startX, y: groundY - blockH, width: blockW, height: blockH, alive: true },
            { type: "pig", x: startX + blockW/2, y: groundY - blockH - 24 * scale, alive: true, radius: 24 * scale },
            { type: "ice", x: startX - 10 * scale, y: groundY - blockH - 26 * scale, width: longW, height: longThinH, alive: true },
            { type: "pig", x: startX + blockW + 40 * scale, y: groundY - 24 * scale, alive: true, radius: 24 * scale }
        ];
    } else if (lvl === 2) {
        targets = [
            { type: "wood", x: startX, y: groundY - blockH, width: blockW, height: blockH, alive: true },
            { type: "wood", x: startX + 75 * scale, y: groundY - blockH, width: blockW, height: blockH, alive: true },
            { type: "stone", x: startX - 15 * scale, y: groundY - blockH - longThinH, width: longW + 30 * scale, height: longThinH, alive: true },
            { type: "pig", x: startX + 37 * scale, y: groundY - blockH - 48 * scale, alive: true, radius: 24 * scale },
            { type: "pig", x: startX + 37 * scale, y: groundY - 24 * scale, alive: true, radius: 24 * scale }
        ];
    } else if (lvl === 3) {
        let hillTopY = groundY - 55 * scale;
        targets = [
            { type: "stone", x: startX, y: hillTopY - blockH, width: blockW, height: blockH, alive: true },
            { type: "stone", x: startX + 85 * scale, y: hillTopY - blockH, width: blockW, height: blockH, alive: true },
            { type: "wood", x: startX - 10 * scale, y: hillTopY - blockH - longThinH, width: longW + 20 * scale, height: longThinH, alive: true },
            { type: "pig", x: startX + 42 * scale, y: hillTopY - blockH - 42 * scale, alive: true, radius: 24 * scale },
            { type: "pig", x: startX + 125 * scale, y: hillTopY - 24 * scale, alive: true, radius: 24 * scale }
        ];
    } else if (lvl === 4) {
        targets = [
            { type: "wood", x: startX + 30 * scale, y: groundY - blockH, width: blockW, height: blockH, alive: true },
            { type: "ice", x: startX, y: groundY - blockH - longThinH, width: longW, height: longThinH, alive: true },
            { type: "pig", x: startX + 50 * scale, y: groundY - blockH - 38 * scale, alive: true, radius: 24 * scale },
            { type: "stone", x: startX + 15 * scale, y: groundY - blockH * 2 - longThinH, width: 85 * scale, height: longThinH, alive: true },
            { type: "pig", x: startX + 57 * scale, y: groundY - blockH * 2 - 62 * scale, alive: true, radius: 24 * scale }
        ];
    } else if (lvl === 5) {
        let hillTopY2 = groundY - 70 * scale;
        targets = [
            { type: "stone", x: startX - 20 * scale, y: hillTopY2 - blockH, width: blockW, height: blockH, alive: true },
            { type: "stone", x: startX + 65 * scale, y: hillTopY2 - blockH, width: blockW, height: blockH, alive: true },
            { type: "wood", x: startX - 35 * scale, y: hillTopY2 - blockH - longThinH, width: longW + 50 * scale, height: longThinH, alive: true },
            { type: "pig", x: startX + 22 * scale, y: hillTopY2 - blockH - 42 * scale, alive: true, radius: 24 * scale },
            { type: "pig", x: startX - 10 * scale, y: hillTopY2 - 24 * scale, alive: true, radius: 24 * scale },
            { type: "pig", x: startX + 85 * scale, y: hillTopY2 - 24 * scale, alive: true, radius: 24 * scale }
        ];
    }
}

function startLevel(lvl) {
    if (lvl > currentUser.maxLevelUnlocked) {
        alert("Bạn cần phải vượt qua màn trước để mở khóa màn này!");
        return;
    }
    gameState = "PLAYING";
    score = 0;
    lives = 4;
    levelMenuScreen.classList.add("hidden");
    gameOverScreen.classList.add("hidden");
    loadLevel(lvl);
    resetBird();

    victorySound.pause();
    victorySound.currentTime = 0;

    if (!isMuted) {
        bgMusic.currentTime = 0;
        bgMusic.play().catch(e => console.log(e));
    }
}

function endGame(isWin) {
    gameState = "GAMEOVER";
    gameOverScreen.classList.remove("hidden");
    bgMusic.pause();

    // Thêm điểm thưởng hoàn thành màn chơi dựa trên số lượt chim còn lại
    if (isWin) {
        let bonusScore = lives * 150;
        score += bonusScore;

        gameOverTitle.textContent = "CHIẾN THẮNG MÀN " + currentLevel + "!";
        gameOverTitle.style.color = "#8ddb44";
        finalScoreText.innerHTML = `Tổng điểm đạt được: ${score} <br><span style="font-size:16px; color:#ffcc00;">(+${bonusScore} điểm thưởng chim dư)</span>`;

        if (currentLevel >= currentUser.maxLevelUnlocked && currentLevel < 5) {
            currentUser.maxLevelUnlocked = currentLevel + 1;
            localStorage.setItem("angryBirdsUser", JSON.stringify(currentUser));
        }

        if (!isMuted) {
            victorySound.currentTime = 0;
            victorySound.play().catch(e => console.log(e));
        }
    } else {
        gameOverTitle.textContent = "HẾT LƯỢT BẮN!";
        gameOverTitle.style.color = "#ff3333";
        finalScoreText.innerHTML = "Điểm số đạt được: " + score;
    }
}

function resetBird() {
    bird.x = sling.x;
    bird.y = sling.y;
    bird.vx = 0;
    bird.vy = 0;
    bird.isLaunched = false;
    bird.isDragging = false;
    bird.skillUsed = false;
    subBirds = [];

    if (currentBirdIndex < birdTypes.length) {
        bird.type = birdTypes[currentBirdIndex];
    } else {
        bird.type = "red";
    }
}

function getPointerPos(e) {
    const rect = canvas.getBoundingClientRect();
    let clientX = e.clientX;
    let clientY = e.clientY;
    if (e.touches && e.touches.length > 0) {
        clientX = e.touches[0].clientX;
        clientY = e.touches[0].clientY;
    }
    return { x: clientX - rect.left, y: clientY - rect.top };
}

function triggerSkill() {
    if (gameState === "PLAYING" && bird.isLaunched && !bird.skillUsed) {
        bird.skillUsed = true;

        if (bird.type === "yellow") {
            bird.vx *= 3.0;
            bird.vy *= 1.2;
        } else if (bird.type === "blue") {
            subBirds.push(
                { x: bird.x, y: bird.y, radius: bird.radius * 0.7, vx: bird.vx * 1.1, vy: bird.vy - 1.8 },
                { x: bird.x, y: bird.y, radius: bird.radius * 0.7, vx: bird.vx * 1.1, vy: bird.vy + 1.8 },
                { x: bird.x, y: bird.y, radius: bird.radius * 0.7, vx: bird.vx * 1.3, vy: bird.vy }
            );
        } else if (bird.type === "black") {
            explode(bird.x, bird.y, 140 * scale);
            bird.isLaunched = false;
            handleBirdFinish();
        }
    }
}

function explode(ex, ey, radius) {
    targets.forEach(t => {
        if (t.alive) {
            let dist = Math.hypot(t.type === "pig" ? t.x - ex : (t.x + t.width/2) - ex, t.type === "pig" ? t.y - ey : (t.y + t.height/2) - ey);
            if (dist < radius + (t.radius || t.width/2)) {
                t.alive = false;
                score += (t.type === "pig" ? 300 : 150);
            }
        }
    });
}

function onTouchStart(e) {
    if (gameState !== "PLAYING") return;
    if (bird.isLaunched) {
        triggerSkill();
        return;
    }
    if (lives <= 0) return;

    const pos = getPointerPos(e);
    if (Math.hypot(pos.x - bird.x, pos.y - bird.y) < bird.radius + 30) {
        bird.isDragging = true;
    }
}

function onTouchMove(e) {
    if (!bird.isDragging) return;
    const pos = getPointerPos(e);
    const dx = pos.x - sling.x;
    const dy = pos.y - sling.y;
    const dist = Math.hypot(dx, dy);
    const maxDrag = 110 * scale;

    let angle = Math.atan2(dy, dx);
    let currentDist = Math.min(dist, maxDrag);

    bird.x = sling.x + Math.cos(angle) * currentDist;
    bird.y = sling.y + Math.sin(angle) * currentDist;
}

function onTouchEnd() {
    if (!bird.isDragging) return;
    bird.isDragging = false;
    bird.isLaunched = true;

    bird.vx = (sling.x - bird.x) * 0.23;
    bird.vy = (sling.y - bird.y) * 0.23;
}

window.addEventListener("mousedown", onTouchStart);
window.addEventListener("mousemove", onTouchMove);
window.addEventListener("mouseup", onTouchEnd);

canvas.addEventListener("touchstart", onTouchStart, { passive: true });
canvas.addEventListener("touchmove", onTouchMove, { passive: true });
window.addEventListener("touchend", onTouchEnd);
window.addEventListener("resize", resizeCanvas);

function checkCollision(b, t) {
    if (!t.alive) return false;
    if (t.type === "pig") {
        return Math.hypot(b.x - t.x, b.y - t.y) < b.radius + t.radius;
    } else {
        let closestX = Math.max(t.x, Math.min(b.x, t.x + t.width));
        let closestY = Math.max(t.y, Math.min(b.y, t.y + t.height));
        return Math.hypot(b.x - closestX, b.y - closestY) < b.radius;
    }
}

function drawBirdByType(type, x, y, r) {
    ctx.save();
    ctx.translate(x, y);

    if (type === "red") {
        let grad = ctx.createRadialGradient(-r*0.2, -r*0.2, r*0.1, 0, 0, r);
        grad.addColorStop(0, "#ff5252");
        grad.addColorStop(0.7, "#d32f2f");
        grad.addColorStop(1, "#b71c1c");
        ctx.fillStyle = grad;
        ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = "#7f0000"; ctx.lineWidth = 2 * scale; ctx.stroke();

        ctx.fillStyle = "#5c0000";
        ctx.beginPath(); ctx.moveTo(-r*0.8, -r*0.4); ctx.lineTo(r*0.6, -r*0.1); ctx.lineTo(r*0.5, r*0.1); ctx.lineTo(-r*0.7, -r*0.2); ctx.closePath(); ctx.fill();
        
        drawEyesAndBeak(r, "#ffa726", "#fb8c00");

    } else if (type === "yellow") {
        ctx.fillStyle = "#ffeb3b";
        ctx.beginPath();
        ctx.moveTo(r*1.3, 0);
        ctx.lineTo(-r, -r*1.1);
        ctx.lineTo(-r, r*1.1);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = "#f57f17"; ctx.lineWidth = 2 * scale; ctx.stroke();

        ctx.fillStyle = "#f57f17";
        ctx.beginPath(); ctx.moveTo(-r*0.5, -r*0.5); ctx.lineTo(r*0.4, -r*0.2); ctx.lineTo(r*0.3, 0); ctx.lineTo(-r*0.4, -r*0.2); ctx.closePath(); ctx.fill();

        ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(0, -r*0.15, r*0.3, 0, Math.PI*2); ctx.fill(); ctx.stroke();
        ctx.fillStyle = "#000"; ctx.beginPath(); ctx.arc(r*0.1, -r*0.15, r*0.1, 0, Math.PI*2); ctx.fill();

        ctx.fillStyle = "#ff9800";
        ctx.beginPath(); ctx.moveTo(r*1.1, -r*0.1); ctx.lineTo(r*1.8, r*0.1); ctx.lineTo(r*1.1, r*0.3); ctx.closePath(); ctx.fill(); ctx.stroke();

    } else if (type === "blue") {
        let grad = ctx.createRadialGradient(-r*0.2, -r*0.2, r*0.1, 0, 0, r);
        grad.addColorStop(0, "#4fc3f7");
        grad.addColorStop(0.7, "#0288d1");
        grad.addColorStop(1, "#01579b");
        ctx.fillStyle = grad;
        ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = "#002f6c"; ctx.lineWidth = 2 * scale; ctx.stroke();

        drawEyesAndBeak(r, "#ffb300", "#fb8c00");

    } else if (type === "black") {
        let grad = ctx.createRadialGradient(-r*0.2, -r*0.2, r*0.1, 0, 0, r);
        grad.addColorStop(0, "#424242");
        grad.addColorStop(0.7, "#212121");
        grad.addColorStop(1, "#000000");
        ctx.fillStyle = grad;
        ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = "#ff5722"; ctx.lineWidth = 2.5 * scale; ctx.stroke();

        ctx.strokeStyle = "#ff9800"; ctx.lineWidth = 3 * scale;
        ctx.beginPath(); ctx.moveTo(0, -r); ctx.quadraticCurveTo(r*0.5, -r*1.5, r*0.8, -r*1.3); ctx.stroke();
        ctx.fillStyle = "#f44336"; ctx.beginPath(); ctx.arc(r*0.8, -r*1.3, r*0.25, 0, Math.PI*2); ctx.fill();

        ctx.fillStyle = "#ff5722";
        ctx.beginPath(); ctx.moveTo(-r*0.7, -r*0.4); ctx.lineTo(r*0.7, -r*0.4); ctx.lineTo(r*0.4, -r*0.2); ctx.lineTo(-r*0.5, -r*0.2); ctx.closePath(); ctx.fill();

        drawEyesAndBeak(r, "#ff9800", "#f57c00");
    }

    ctx.restore();
}

function drawEyesAndBeak(r, beakColor1, beakColor2) {
    ctx.fillStyle = "#ffffff";
    ctx.beginPath();
    ctx.arc(-r*0.25, -r*0.05, r*0.3, 0, Math.PI * 2);
    ctx.arc(r*0.25, -r*0.05, r*0.3, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#000"; ctx.lineWidth = 1.5 * scale; ctx.stroke();

    ctx.fillStyle = "#000000";
    ctx.beginPath();
    ctx.arc(-r*0.15, -r*0.05, r*0.1, 0, Math.PI * 2);
    ctx.arc(r*0.35, -r*0.05, r*0.1, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = beakColor1;
    ctx.beginPath();
    ctx.moveTo(r*0.2, r*0.05);
    ctx.lineTo(r*0.8, r*0.15);
    ctx.lineTo(r*0.3, r*0.38);
    ctx.closePath();
    ctx.fill(); ctx.stroke();

    ctx.fillStyle = beakColor2;
    ctx.beginPath();
    ctx.moveTo(r*0.2, r*0.35);
    ctx.lineTo(r*0.65, r*0.42);
    ctx.lineTo(r*0.3, r*0.6);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
}

function drawPig(x, y, r) {
    ctx.save();
    ctx.translate(x, y);

    ctx.strokeStyle = "#000000";
    ctx.lineWidth = 2.2 * scale;

    ctx.fillStyle = "#6fc525";
    ctx.beginPath(); ctx.arc(-r * 0.42, -r * 0.78, r * 0.3, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#6fc525";
    ctx.beginPath(); ctx.arc(r * 0.42, -r * 0.78, r * 0.3, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

    ctx.fillStyle = "#7acc29";
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

    let timeSec = Date.now() / 400;
    let isBlinking = (Math.sin(timeSec + x) > 0.85);
    let eyeRadius = r * 0.28;
    let eyeOffsetX = r * 0.46;

    ctx.fillStyle = "#ffffff";
    ctx.beginPath(); ctx.arc(-eyeOffsetX, -r * 0.15, eyeRadius, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    if (!isBlinking) {
        ctx.fillStyle = "#000000";
        ctx.beginPath(); ctx.arc(-eyeOffsetX + r * 0.05, -r * 0.15, r * 0.08, 0, Math.PI * 2); ctx.fill();
    }

    ctx.fillStyle = "#ffffff";
    ctx.beginPath(); ctx.arc(eyeOffsetX, -r * 0.15, eyeRadius, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    if (!isBlinking) {
        ctx.fillStyle = "#000000";
        ctx.beginPath(); ctx.arc(eyeOffsetX - r * 0.05, -r * 0.15, r * 0.08, 0, Math.PI * 2); ctx.fill();
    }

    ctx.fillStyle = "#8fe038";
    ctx.beginPath(); ctx.ellipse(0, r * 0.18, r * 0.45, r * 0.35, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#2d570c";
    ctx.beginPath(); ctx.arc(-r * 0.13, r * 0.16, r * 0.07, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(r * 0.13, r * 0.16, r * 0.07, 0, Math.PI * 2); ctx.fill();

    ctx.restore();
}

function drawCanvasBackground() {
    let skyGrad = ctx.createLinearGradient(0, 0, 0, groundY);
    skyGrad.addColorStop(0, "#4ca2cd");
    skyGrad.addColorStop(1, "#b4f0f8");
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "rgba(255, 255, 255, 0.7)";
    drawCloud(canvas.width * 0.25, canvas.height * 0.15, 80 * scale);
    drawCloud(canvas.width * 0.7, canvas.height * 0.22, 100 * scale);

    ctx.fillStyle = "#73c03a";
    ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);

    ctx.strokeStyle = "#498422";
    ctx.lineWidth = 4 * scale;
    ctx.beginPath();
    ctx.moveTo(0, groundY);
    ctx.lineTo(canvas.width, groundY);
    ctx.stroke();
}

function drawCloud(x, y, size) {
    ctx.beginPath();
    ctx.arc(x, y, size * 0.4, 0, Math.PI * 2);
    ctx.arc(x + size * 0.35, y - size * 0.15, size * 0.35, 0, Math.PI * 2);
    ctx.arc(x + size * 0.7, y, size * 0.3, 0, Math.PI * 2);
    ctx.fill();
}

function handleBirdFinish() {
    lives--;
    currentBirdIndex++;
    let remainingPigs = targets.some(t => t.type === "pig" && t.alive);
    if (!remainingPigs) {
        endGame(true);
    } else if (lives <= 0 || currentBirdIndex >= birdTypes.length) {
        setTimeout(() => {
            let checkPigs = targets.some(t => t.type === "pig" && t.alive);
            if (!checkPigs) endGame(true);
            else endGame(false);
        }, 500);
    } else {
        resetBird();
    }
}

function update() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    drawCanvasBackground();

    groundHills.forEach(hill => {
        ctx.fillStyle = "#61a82d";
        ctx.beginPath();
        ctx.ellipse(hill.x + hill.w/2, groundY, hill.w/2, hill.h, 0, Math.PI, 0, false);
        ctx.fill();
        ctx.strokeStyle = "#3e6d1c";
        ctx.lineWidth = 3 * scale;
        ctx.stroke();
    });

    ctx.strokeStyle = "#3e2723";
    ctx.lineWidth = 10 * scale;
    ctx.beginPath();
    ctx.moveTo(sling.x, sling.y);
    ctx.lineTo(sling.x, groundY);
    ctx.stroke();

    if (gameState === "PLAYING") {
        ctx.fillStyle = "#fff";
        ctx.font = "bold 22px Arial";
        ctx.textAlign = "center";
        ctx.fillText(`MÀN: ${currentLevel} | ĐIỂM: ${score}`, canvas.width / 2, 45);

        for (let i = currentBirdIndex + 1; i < birdTypes.length; i++) {
            let idxOffset = i - (currentBirdIndex + 1);
            drawBirdByType(birdTypes[i], sling.x - 45 - (idxOffset * 35), groundY - 18 * scale, 12 * scale);
        }

        if (bird.isDragging) {
            ctx.strokeStyle = "#3e2723";
            ctx.lineWidth = 4 * scale;
            ctx.beginPath();
            ctx.moveTo(sling.x - 8, sling.y - 5);
            ctx.lineTo(bird.x, bird.y);
            ctx.lineTo(sling.x + 8, sling.y - 5);
            ctx.stroke();

            let simX = bird.x;
            let simY = bird.y;
            let simVx = (sling.x - bird.x) * 0.23;
            let simVy = (sling.y - bird.y) * 0.23;

            ctx.fillStyle = "rgba(255, 255, 255, 0.7)";
            for (let i = 0; i < 25; i += 2) {
                simX += simVx * 2;
                simY += simVy * 2;
                simVy += 0.22 * 2;
                if (simY >= groundY) break;
                ctx.beginPath();
                ctx.arc(simX, simY, 3 * scale, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        if (bird.isLaunched) {
            bird.x += bird.vx;
            bird.y += bird.vy;
            bird.vy += 0.22;

            if (bird.y + bird.radius >= groundY || bird.x > canvas.width || bird.x < 0) {
                bird.isLaunched = false;
                handleBirdFinish();
            }
        }

        subBirds.forEach(sb => {
            sb.x += sb.vx;
            sb.y += sb.vy;
            sb.vy += 0.22;
            drawBirdByType("blue", sb.x, sb.y, sb.radius);

            targets.forEach(t => {
                if (t.alive && checkCollision(sb, t)) {
                    t.alive = false;
                    score += (t.type === "pig" ? 200 : 100);
                }
            });
        });

        drawBirdByType(bird.type, bird.x, bird.y, bird.radius);

        let activePigs = false;
        targets.forEach(t => {
            if (t.alive) {
                if (t.type === "pig") activePigs = true;

                if (checkCollision(bird, t)) {
                    t.alive = false;
                    score += (t.type === "pig" ? 200 : (t.type === "stone" ? 150 : 100));
                    bird.vx *= -0.3;
                    bird.vy *= -0.3;
                }

                if (t.alive) {
                    if (t.type === "pig") {
                        drawPig(t.x, t.y, t.radius);
                    } else {
                        if (t.type === "wood") ctx.fillStyle = "#b5651d";
                        else if (t.type === "ice") ctx.fillStyle = "#81d4fa";
                        else ctx.fillStyle = "#90a4ae";

                        ctx.fillRect(t.x, t.y, t.width, t.height);
                        ctx.strokeStyle = "#222";
                        ctx.lineWidth = 1.5 * scale;
                        ctx.strokeRect(t.x, t.y, t.width, t.height);
                    }
                }
            }
        });

        if (!activePigs && targets.length > 0) {
            endGame(true);
        }
    }

    requestAnimationFrame(update);
}

resizeCanvas();
update();
</script>
</body>
</html>
