<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Angry Birds Mini - Remastered</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #111;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 1200px;
            max-height: 700px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        canvas {
            background: linear-gradient(to bottom, #4ca2cd, #67b26f);
            display: block;
            width: 100%;
            height: 100%;
        }
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            color: white;
            text-align: center;
            padding: 20px;
            backdrop-filter: blur(5px);
        }
        .overlay h1 {
            font-size: 52px;
            margin: 0 0 15px 0;
            color: #ffcc00;
            text-shadow: 3px 3px 0px #ff3333, 5px 5px 15px rgba(0,0,0,0.7);
        }
        .overlay p {
            font-size: 20px;
            margin: 0 0 30px 0;
            color: #ddd;
        }
        .btn {
            padding: 16px 45px;
            font-size: 22px;
            font-weight: bold;
            background: linear-gradient(to bottom, #8ddb44, #558822);
            color: #fff;
            border: 2px solid #335511;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 6px 0 #335511, 0 10px 20px rgba(0,0,0,0.4);
            transition: 0.1s;
        }
        .btn:hover {
            background: linear-gradient(to bottom, #9ee85c, #669922);
        }
        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #335511, 0 5px 10px rgba(0,0,0,0.4);
        }
        .hidden {
            display: none !important;
        }

        /* Nút Setting hình bánh răng ở góc trên bên trái */
        #gearBtn {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 300;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid rgba(255, 255, 255, 0.7);
            color: #fff;
            width: 50px;
            height: 50px;
            font-size: 26px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(4px);
            transition: 0.2s;
        }
        #gearBtn:hover {
            background: rgba(0, 0, 0, 0.9);
            border-color: #ffcc00;
            transform: rotate(45deg);
        }

        /* Trang nhỏ (Modal) Cài đặt âm lượng và nhạc */
        #settingsModal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 400;
            backdrop-filter: blur(6px);
        }
        .settings-content {
            background: #222;
            border: 3px solid #558822;
            padding: 30px;
            border-radius: 20px;
            width: 350px;
            text-align: center;
            color: white;
            box-shadow: 0 10px 25px rgba(0,0,0,0.9);
        }
        .settings-content h2 {
            margin-top: 0;
            color: #ffcc00;
        }
        .setting-group {
            margin: 20px 0;
            text-align: left;
        }
        .setting-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        .setting-group select, .setting-group input[type="range"] {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: none;
            background: #333;
            color: white;
            font-size: 16px;
        }
        .setting-group input[type="range"] {
            cursor: pointer;
        }
        .close-btn {
            background: #ff3333;
            color: white;
            border: none;
            padding: 10px 25px;
            font-size: 18px;
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }
        .close-btn:hover {
            background: #ff1a1a;
        }
    </style>
</head>
<body>

    <div id="gameContainer">
        <!-- Nút Setting hình bánh răng -->
        <button id="gearBtn" onclick="openSettings()">⚙️</button>

        <!-- Trang nhỏ chỉnh âm lượng và đổi nhạc (Modal) -->
        <div id="settingsModal" class="hidden">
            <div class="settings-content">
                <h2>CÀI ĐẶT ÂM THANH</h2>
                
                <div class="setting-group">
                    <label>Chọn Nhạc Nền:</label>
                    <select id="bgMusicSelect" onchange="changeBackgroundMusic()">
                        <option value="angrybird.sound.mp4">Nhạc 1 (angrybird.sound.mp4)</option>
                        <option value="angrybird.sound2.mp4">Nhạc 2 (angrybird.sound2.mp4)</option>
                    </select>
                </div>

                <div class="setting-group">
                    <label>Âm lượng: <span id="volumeValue">50</span>%</label>
                    <input type="range" id="volumeSlider" min="0" max="100" value="50" oninput="updateVolume(this.value)">
                </div>

                <div class="setting-group" style="display: flex; gap: 10px;">
                    <button class="btn" style="flex:1; padding: 10px; font-size: 16px;" onclick="toggleMute()" id="muteBtn">Tắt Nhạc</button>
                </div>

                <button class="close-btn" onclick="closeSettings()">Đóng</button>
            </div>
        </div>

        <!-- Màn hình bắt đầu -->
        <div id="startScreen" class="overlay">
            <h1>ANGRY BIRDS MINI</h1>
            <p>Kéo và thả chim để phá hủy toàn bộ heo xanh trong 3 lượt bắn!</p>
            <button class="btn" onclick="startGame()">BẮT ĐẦU CHƠI</button>
        </div>

        <!-- Màn hình kết quả -->
        <div id="gameOverScreen" class="overlay hidden">
            <h1 id="gameOverTitle">CHIẾN THẮNG!</h1>
            <p id="finalScoreText">Tổng điểm tuyệt đối: 0</p>
            <button class="btn" onclick="startGame()">CHƠI LẠI</button>
        </div>

        <canvas id="gameCanvas"></canvas>
    </div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const startScreen = document.getElementById("startScreen");
const gameOverScreen = document.getElementById("gameOverScreen");
const gameOverTitle = document.getElementById("gameOverTitle");
const finalScoreText = document.getElementById("finalScoreText");
const settingsModal = document.getElementById("settingsModal");
const volumeSlider = document.getElementById("volumeSlider");
const volumeValue = document.getElementById("volumeValue");
const muteBtn = document.getElementById("muteBtn");
const bgMusicSelect = document.getElementById("bgMusicSelect");

// Khởi tạo các đối tượng âm thanh
let currentMusicFile = "angrybird.sound.mp4";
let bgMusic = new Audio(currentMusicFile);
bgMusic.loop = true;
bgMusic.volume = 0.5;

const victorySound = new Audio("victorysound.mp4");
victorySound.volume = 0.7;

let isMuted = false;

// Mở/Đóng bảng Setting
function openSettings() {
    settingsModal.classList.remove("hidden");
}

function closeSettings() {
    settingsModal.classList.add("hidden");
}

// Thay đổi file nhạc nền
function changeBackgroundMusic() {
    let selectedFile = bgMusicSelect.value;
    bgMusic.pause();
    currentMusicFile = selectedFile;
    bgMusic = new Audio(currentMusicFile);
    bgMusic.loop = true;
    bgMusic.volume = volumeSlider.value / 100;

    if (!isMuted && gameState === "PLAYING") {
        bgMusic.play().catch(e => console.log(e));
    }
}

// Cập nhật âm lượng từ thanh trượt (0 - 100)
function updateVolume(val) {
    volumeValue.textContent = val;
    let vol = val / 100;
    bgMusic.volume = vol;
    victorySound.volume = vol;
    if (val > 0 && isMuted) {
        isMuted = false;
        muteBtn.textContent = "Tắt Nhạc";
        muteBtn.style.background = "linear-gradient(to bottom, #8ddb44, #558822)";
    }
}

// Nút tắt/bật nhạc nhanh trong setting
function toggleMute() {
    isMuted = !isMuted;
    if (isMuted) {
        bgMusic.pause();
        victorySound.pause();
        muteBtn.textContent = "Bật Nhạc";
        muteBtn.style.background = "#ff3333";
    } else {
        muteBtn.textContent = "Tắt Nhạc";
        muteBtn.style.background = "linear-gradient(to bottom, #8ddb44, #558822)";
        if (gameState === "PLAYING") {
            bgMusic.play().catch(e => console.log(e));
        }
    }
}

// Tải hình ảnh chú heo xanh
const pigImage = new Image();
pigImage.src = "pig.png"; 

let gameState = "MENU"; 
let score = 0;
let lives = 3;
let groundY = 0;
let scale = 1;

let sling = { x: 0, y: 0 };
let bird = { x: 0, y: 0, radius: 18, vx: 0, vy: 0, isDragging: false, isLaunched: false };
let targets = [];
let clouds = [];

function resizeCanvas() {
    canvas.width = canvas.parentElement.clientWidth;
    canvas.height = canvas.parentElement.clientHeight;

    let scaleX = canvas.width / 1000;
    let scaleY = canvas.height / 600;
    scale = Math.min(scaleX, scaleY);
    if (scale < 0.6) scale = 0.6;

    groundY = canvas.height - 90 * scale;
    sling.x = canvas.width * 0.2;
    sling.y = groundY - 100 * scale;

    if (!bird.isLaunched && !bird.isDragging) {
        bird.x = sling.x;
        bird.y = sling.y;
    }

    bird.radius = 18 * scale;

    const startX = canvas.width * 0.65;
    const boxW = 45 * scale;
    const boxH = 55 * scale;

    targets = [
        { type: "wood", x: startX, y: groundY - boxH, width: boxW, height: boxH, alive: true, health: 2 },
        { type: "pig", x: startX + boxW/2, y: groundY - boxH - 18 * scale, alive: true, radius: 18 * scale },
        { type: "wood", x: startX + boxW + 20 * scale, y: groundY - boxH, width: boxW, height: boxH, alive: true, health: 2 },
        { type: "pig", x: startX + boxW + 20 * scale + boxW/2, y: groundY - boxH - 18 * scale, alive: true, radius: 18 * scale },
        { type: "ice", x: startX + 5 * scale, y: groundY - boxH * 2 - 5 * scale, width: boxW * 2 + 10 * scale, height: 20 * scale, alive: true, health: 1 },
        { type: "pig", x: startX + boxW + 10 * scale, y: groundY - boxH * 2 - 28 * scale, alive: true, radius: 18 * scale }
    ];

    if (clouds.length === 0) {
        clouds = [
            { x: canvas.width * 0.15, y: canvas.height * 0.2, speed: 0.2, w: 100 * scale },
            { x: canvas.width * 0.6, y: canvas.height * 0.1, speed: 0.15, w: 140 * scale }
        ];
    }
}

function startGame() {
    gameState = "PLAYING";
    score = 0;
    lives = 3;
    resizeCanvas();
    resetBird();
    startScreen.classList.add("hidden");
    gameOverScreen.classList.add("hidden");

    victorySound.pause();
    victorySound.currentTime = 0;

    if (!isMuted) {
        bgMusic.currentTime = 0;
        bgMusic.play().catch(error => {
            console.log("Trình duyệt chặn tự động phát nhạc:", error);
        });
    }
}

function endGame(isWin) {
    gameState = "GAMEOVER";
    gameOverScreen.classList.remove("hidden");
    bgMusic.pause();

    if (isWin) {
        gameOverTitle.textContent = "CHIẾN THẮNG!";
        gameOverTitle.style.color = "#8ddb44";
        finalScoreText.innerHTML = "Tổng điểm tuyệt đối: " + score;

        if (!isMuted) {
            victorySound.currentTime = 0;
            victorySound.play().catch(e => console.log(e));
        }
    } else {
        gameOverTitle.textContent = "HẾT LƯỢT BẮN!";
        gameOverTitle.style.color = "#ff3333";
        finalScoreText.innerHTML = "Điểm số đạt được: " + score;
    }
}

function resetBird() {
    bird.x = sling.x;
    bird.y = sling.y;
    bird.vx = 0;
    bird.vy = 0;
    bird.isLaunched = false;
    bird.isDragging = false;
}

function getPointerPos(e) {
    const rect = canvas.getBoundingClientRect();
    let clientX = e.clientX;
    let clientY = e.clientY;
    if (e.touches && e.touches.length > 0) {
        clientX = e.touches[0].clientX;
        clientY = e.touches[0].clientY;
    }
    return { x: clientX - rect.left, y: clientY - rect.top };
}

function onTouchStart(e) {
    if (gameState !== "PLAYING" || bird.isLaunched || lives <= 0) return;
    const pos = getPointerPos(e);
    if (Math.hypot(pos.x - bird.x, pos.y - bird.y) < bird.radius + 30) {
        bird.isDragging = true;
    }
}

function onTouchMove(e) {
    if (!bird.isDragging) return;
    const pos = getPointerPos(e);
    const dx = pos.x - sling.x;
    const dy = pos.y - sling.y;
    const dist = Math.hypot(dx, dy);
    const maxDrag = 110 * scale;

    let angle = Math.atan2(dy, dx);
    let currentDist = Math.min(dist, maxDrag);

    bird.x = sling.x + Math.cos(angle) * currentDist;
    bird.y = sling.y + Math.sin(angle) * currentDist;
}

function onTouchEnd() {
    if (!bird.isDragging) return;
    bird.isDragging = false;
    bird.isLaunched = true;

    bird.vx = (sling.x - bird.x) * 0.23;
    bird.vy = (sling.y - bird.y) * 0.23;
}

window.addEventListener("mousedown", onTouchStart);
window.addEventListener("mousemove", onTouchMove);
window.addEventListener("mouseup", onTouchEnd);

canvas.addEventListener("touchstart", onTouchStart, { passive: true });
canvas.addEventListener("touchmove", onTouchMove, { passive: true });
window.addEventListener("touchend", onTouchEnd);
window.addEventListener("resize", resizeCanvas);

function checkCollision(b, t) {
    if (!t.alive) return false;
    if (t.type === "pig") {
        return Math.hypot(b.x - t.x, b.y - t.y) < b.radius + t.radius;
    } else {
        let closestX = Math.max(t.x, Math.min(b.x, t.x + t.width));
        let closestY = Math.max(t.y, Math.min(b.y, t.y + t.height));
        return Math.hypot(b.x - closestX, b.y - closestY) < b.radius;
    }
}

function drawBird(x, y, r) {
    ctx.fillStyle = "#e62e00";
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#991400";
    ctx.lineWidth = 2 * scale;
    ctx.stroke();

    ctx.fillStyle = "#fff";
    ctx.beginPath();
    ctx.arc(x + r*0.35, y - r*0.15, r*0.3, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#000";
    ctx.beginPath();
    ctx.arc(x + r*0.45, y - r*0.15, r*0.1, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#ffb800";
    ctx.beginPath();
    ctx.moveTo(x + r*0.7, y);
    ctx.lineTo(x + r*1.2, y + r*0.1);
    ctx.lineTo(x + r*0.7, y + r*0.25);
    ctx.closePath();
    ctx.fill();
}

function drawPig(x, y, r) {
    if (pigImage.complete && pigImage.naturalWidth !== 0) {
        ctx.drawImage(pigImage, x - r, y - r, r * 2, r * 2);
    } else {
        ctx.fillStyle = "#7acc29";
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
    }
}

function update() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    clouds.forEach(c => {
        c.x += c.speed;
        if (c.x > canvas.width) c.x = -c.w;
        ctx.fillStyle = "rgba(255, 255, 255, 0.5)";
        ctx.beginPath();
        ctx.arc(c.x, c.y, c.w * 0.3, 0, Math.PI * 2);
        ctx.arc(c.x + c.w * 0.25, c.y - c.w * 0.1, c.w * 0.35, 0, Math.PI * 2);
        ctx.fill();
    });

    ctx.fillStyle = "#5c4033";
    ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);
    ctx.fillStyle = "#43a047";
    ctx.fillRect(0, groundY, canvas.width, 18 * scale);

    ctx.strokeStyle = "#3e2723";
    ctx.lineWidth = 10 * scale;
    ctx.beginPath();
    ctx.moveTo(sling.x, sling.y);
    ctx.lineTo(sling.x, groundY);
    ctx.stroke();

    if (gameState === "PLAYING") {
        ctx.fillStyle = "#fff";
        ctx.font = "bold 24px Arial";
        ctx.textAlign = "center";
        ctx.fillText("ĐIỂM: " + score, canvas.width / 2, 45);

        for (let i = 0; i < lives - 1; i++) {
            drawBird(sling.x - 45 - (i * 30), groundY - 18 * scale, 12 * scale);
        }

        if (bird.isDragging) {
            ctx.strokeStyle = "#3e2723";
            ctx.lineWidth = 4 * scale;
            ctx.beginPath();
            ctx.moveTo(sling.x - 8, sling.y - 5);
            ctx.lineTo(bird.x, bird.y);
            ctx.lineTo(sling.x + 8, sling.y - 5);
            ctx.stroke();

            let simX = bird.x;
            let simY = bird.y;
            let simVx = (sling.x - bird.x) * 0.23;
            let simVy = (sling.y - bird.y) * 0.23;

            ctx.fillStyle = "rgba(255, 255, 255, 0.6)";
            for (let i = 0; i < 25; i += 2) {
                simX += simVx * 2;
                simY += simVy * 2;
                simVy += 0.22 * 2;
                if (simY >= groundY) break;
                ctx.beginPath();
                ctx.arc(simX, simY, 3 * scale, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        if (bird.isLaunched) {
            bird.x += bird.vx;
            bird.y += bird.vy;
            bird.vy += 0.22;

            if (bird.y + bird.radius >= groundY || bird.x > canvas.width || bird.x < 0) {
                bird.isLaunched = false;
                lives--;
                
                let remainingPigs = targets.some(t => t.type === "pig" && t.alive);
                if (!remainingPigs) {
                    endGame(true);
                } else if (lives <= 0) {
                    endGame(false);
                } else {
                    resetBird();
                }
            }
        }

        drawBird(bird.x, bird.y, bird.radius);

        let activePigs = false;
        targets.forEach(t => {
            if (t.alive) {
                if (t.type === "pig") activePigs = true;

                if (checkCollision(bird, t)) {
                    t.alive = false;
                    score += (t.type === "pig" ? 200 : 100);
                }

                if (t.type === "pig") {
                    drawPig(t.x, t.y, t.radius);
                } else {
                    ctx.fillStyle = t.type === "wood" ? "#b5651d" : "#81d4fa";
                    ctx.fillRect(t.x, t.y, t.width, t.height);
                    ctx.strokeStyle = t.type === "wood" ? "#7c3f0b" : "#29b6f6";
                    ctx.lineWidth = 2 * scale;
                    ctx.strokeRect(t.x, t.y, t.width, t.height);
                }
            }
        });

        if (!activePigs && targets.length > 1) {
            endGame(true);
        }
    }

    requestAnimationFrame(update);
}

resizeCanvas();
update();
</script>
</body>
</html>
