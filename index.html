<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Đua Vịt 🦆</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:linear-gradient(#fff,#f3f7fb);color:#172033}
.wrap{max-width:850px;margin:auto;padding:24px 14px 50px}
h1{text-align:center;color:#f39a00;font-size:clamp(32px,7vw,58px);margin:5px 0 22px}
.card{background:#fff;border:1px solid #e5e9ef;border-radius:26px;padding:18px;box-shadow:0 8px 30px #15223812;margin-bottom:18px}
label{font-weight:800;display:block;margin-bottom:9px;font-size:18px}
textarea{width:100%;min-height:145px;border:2px solid #dfe5ee;border-radius:18px;padding:14px;font-size:18px;resize:vertical;outline:none}
textarea:focus,input:focus{border-color:#6657e8}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
button{border:0;border-radius:16px;padding:13px 18px;font-size:17px;font-weight:800;cursor:pointer;background:#eef1f6;color:#172033}
button:hover{filter:brightness(.97)}
.primary{background:#6546e8;color:#fff}
.green{background:#11b981;color:#fff}
.small{font-size:14px;color:#687386}
.titleRow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:13px}
.titleRow h2{margin:0;font-size:27px}
.badge{background:#fff3bf;color:#9a6800;border:1px solid #ffe27b;border-radius:999px;padding:9px 14px;font-weight:800;white-space:nowrap}
.track{position:relative;overflow:hidden;border:8px solid #2866e9;border-radius:30px;min-height:430px;background:linear-gradient(180deg,#08b9ef,#1689ed);padding:12px 82px 12px 8px}
.finish{position:absolute;right:0;top:0;width:70px;height:100%;background:repeating-linear-gradient(135deg,#111 0 14px,#fff 14px 28px);border-left:3px solid #fff;z-index:3}
.finish span{position:absolute;top:8px;right:4px;background:#ef2020;color:white;padding:9px 8px;border-radius:10px;font-weight:900}
.lane{position:relative;height:88px;border-bottom:2px dashed #ffffff45}
.lane:last-child{border-bottom:0}
.duck{position:absolute;left:0;top:12px;display:flex;align-items:center;gap:7px;transition:left .08s linear;z-index:4}
.duckIcon{font-size:52px;line-height:1;filter:drop-shadow(0 7px 4px #174b8a55);transform:scaleX(-1)}
.name{background:#fff;border-radius:15px;padding:7px 11px;box-shadow:0 4px 10px #194b7b25;font-weight:800;white-space:nowrap}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;margin-right:7px;vertical-align:-1px}
.controls{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:18px;font-size:18px;font-weight:800}
input[type=number]{width:105px;border:2px solid #dfe5ee;border-radius:14px;padding:12px;font-size:20px;font-weight:800;text-align:center}
.start{display:block;width:min(100%,520px);margin:18px auto 0;font-size:20px;padding:17px}
.replay{display:block;margin:13px auto 0}
.result{margin-top:15px;text-align:center;font-size:24px;font-weight:900;min-height:34px}
@media(max-width:600px){
 .wrap{padding:12px 8px 35px}.card{border-radius:20px;padding:13px}
 .track{min-height:410px;padding-right:66px}.finish{width:58px}
 .duckIcon{font-size:44px}.name{font-size:14px;padding:6px 8px}
 .lane{height:86px}.titleRow h2{font-size:22px}
}
</style>
</head>
<body>

<!-- Thẻ audio âm thanh chiến thắng -->
<audio id="winSound" src="win.mp3"></audio>

<div class="wrap">
  <h1>GỌI TÊN NGẪU NHIÊN</h1>

  <section class="card">
    <label for="names">Nhập tên (mỗi dòng 1 người)</label>
    <textarea id="names">Dũng
Hà
Bình
Chi
Phước
Đức
Lan
Tâm
Thủy</textarea>
    <div class="row">
      <button class="primary" onclick="randomNames()">🎲 Random Mẫu</button>
      <button onclick="shuffleNames()">🔀 Xáo tên</button>
      <button onclick="sample3()">Mẫu 3 tên</button>
    </div>
  </section>

  <section class="card">
    <div class="titleRow">
      <h2>🚩 Đường Đua Vịt</h2>
      <div class="badge">👥 <span id="count">9</span> người</div>
    </div>
    <div id="track" class="track">
      <div class="finish"><span>ĐÍCH</span></div>
    </div>

    <div class="controls">
      <span>◷ Thời gian (giây):</span>
      <input id="seconds" type="number" min="3" max="60" value="10">
    </div>
    <button id="start" class="green start" onclick="startRace()">▶️ 🚀 Bắt đầu cuộc đua!</button>
    <button class="replay" onclick="resetRace()">↻ Chơi lại</button>
    <div id="result" class="result"></div>
  </section>
</div>

<script>
const colors=["#d51b67","#f28c00","#ffd21a","#2879d7","#38a957","#7b22bc","#e52662","#14a9b7","#e55b22"];
const duckEmojis=["🦆","🦆","🦆","🦆","🦆","🦆","🦆","🦆","🦆"];
let ducks=[], timer=null, running=false;

const $=id=>document.getElementById(id);
function getNames(){
  return $("names").value.split(/\n+/).map(x=>x.trim()).filter(Boolean).slice(0,12);
}
function buildTrack(){
  const names=getNames();
  $("count").textContent=names.length;
  const track=$("track");
  track.querySelectorAll(".lane").forEach(x=>x.remove());
  ducks=[];
  names.forEach((name,i)=>{
    const lane=document.createElement("div");
    lane.className="lane";
    const duck=document.createElement("div");
    duck.className="duck";
    duck.innerHTML=`<span class="duckIcon">${duckEmojis[i%duckEmojis.length]}</span>
      <span class="name"><i class="dot" style="background:${colors[i%colors.length]}"></i>${escapeHtml(name)}</span>`;
    lane.appendChild(duck); track.appendChild(lane);
    ducks.push({el:duck,name,progress:0,finished:false});
  });
}
function escapeHtml(s){
  return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}
function randomNames(){
  const pool=["Dũng","Hà","Bình","Chi","Phước","Đức","Lan","Tâm","Thủy","An","Minh","Nam"];
  const shuffled=[...pool].sort(()=>Math.random()-.5);
  $("names").value=shuffled.slice(0,9).join("\n"); buildTrack();
}
function shuffleNames(){
  $("names").value=getNames().sort(()=>Math.random()-.5).join("\n"); buildTrack();
}
function sample3(){
  const pool=["Vịt Đỏ","Vịt Vàng","Vịt Xanh","Vịt Hồng","Vịt Tím","Vịt Cam"];
  $("names").value=pool.sort(()=>Math.random()-.5).slice(0,3).join("\n"); buildTrack();
}
function startRace(){
  if(running) return;
  buildTrack();
  if(ducks.length<2){$("result").textContent="Hãy nhập ít nhất 2 tên!";return}
  running=true; $("result").textContent="";
  $("start").disabled=true; $("start").style.opacity=.55;
  const duration=Math.max(3,Math.min(60,Number($("seconds").value)||10));
  const start=performance.now();
  const finishX=()=> $("track").clientWidth-115;
  function frame(now){
    const t=Math.min(1,(now-start)/(duration*1000));
    ducks.forEach((d,i)=>{
      if(d.finished)return;
      // Có chút ngẫu nhiên: vịt chạy nhanh/chậm khác nhau, nhưng vẫn có thể lật kèo.
      const noise=Math.sin(now/170+i*2.3)*.012 + (Math.random()-.5)*.018;
      d.progress=Math.max(d.progress, t*(0.90+((i*37)%17)/100)+noise);
      d.progress=Math.min(1,d.progress);
      const x=Math.max(0, d.progress*(finishX()-15));
      d.el.style.left=x+"px";
    });
    if(t<1){
      timer=requestAnimationFrame(frame);
    }else{
      ducks.forEach(d=>d.progress=Math.min(1,d.progress));
      ducks.sort((a,b)=>b.progress-a.progress);
      finishRace();
    }
  }
  timer=requestAnimationFrame(frame);
}

function finishRace(){
  running=false; $("start").disabled=false; $("start").style.opacity=1;
  const winner=ducks.slice().sort((a,b)=>b.progress-a.progress)[0];
  $("result").textContent=`🏆 ${winner.name} thắng cuộc!`;
  
  // Phát âm thanh chiến thắng
  const winSound = document.getElementById("winSound");
  if(winSound){
    winSound.currentTime = 0;
    winSound.play().catch(e => console.log("Lỗi phát âm thanh:", e));
  }

  confetti();
}

function resetRace(){
  if(timer)cancelAnimationFrame(timer);
  running=false;$("start").disabled=false;$("start").style.opacity=1;
  $("result").textContent="";
  buildTrack();
}
function confetti(){
  for(let i=0;i<55;i++){
    const c=document.createElement("div");
    c.textContent=["●","■","◆","✦"][i%4];
    c.style.cssText=`position:fixed;left:${Math.random()*100}vw;top:-20px;
      font-size:${12+Math.random()*16}px;color:${colors[i%colors.length]};
      z-index:99;pointer-events:none;animation:fall ${1.2+Math.random()*1.7}s linear forwards`;
    document.body.appendChild(c); setTimeout(()=>c.remove(),3200);
  }
}
const style=document.createElement("style");
style.textContent="@keyframes fall{to{transform:translateY(110vh) rotate(600deg);opacity:0}}";
document.head.appendChild(style);

$("names").addEventListener("input",()=>{if(!running)buildTrack()});
buildTrack();
</script>
</body>
</html>
