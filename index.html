<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Angry Birds Mini - Remastered</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #111;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 1400px;
            max-height: 750px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            color: white;
            text-align: center;
            padding: 20px;
            backdrop-filter: blur(5px);
        }
        .overlay h1 {
            font-size: 52px;
            margin: 0 0 15px 0;
            color: #ffcc00;
            text-shadow: 3px 3px 0px #ff3333, 5px 5px 15px rgba(0,0,0,0.7);
        }
        .overlay p {
            font-size: 20px;
            margin: 0 0 20px 0;
            color: #ddd;
        }
        .btn {
            padding: 14px 40px;
            font-size: 20px;
            font-weight: bold;
            background: linear-gradient(to bottom, #8ddb44, #558822);
            color: #fff;
            border: 2px solid #335511;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 6px 0 #335511, 0 10px 20px rgba(0,0,0,0.4);
            transition: 0.1s;
            margin: 8px;
        }
        .btn:hover {
            background: linear-gradient(to bottom, #9ee85c, #669922);
        }
        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #335511, 0 5px 10px rgba(0,0,0,0.4);
        }
        .btn.locked {
            background: linear-gradient(to bottom, #777, #444);
            border-color: #222;
            box-shadow: 0 6px 0 #222;
            cursor: not-allowed;
            opacity: 0.6;
        }
        .hidden {
            display: none !important;
        }
        
        .input-group {
            margin: 12px 0;
            text-align: left;
            width: 300px;
        }
        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #ffcc00;
        }
        .input-group input {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 2px solid #558822;
            background: #222;
            color: white;
            font-size: 16px;
        }
        .avatar-upload {
            display: flex;
            align-items: center;
            gap: 15px;
            margin: 15px 0;
        }
        .avatar-preview {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 2px solid #ffcc00;
            object-fit: cover;
            background: #333;
        }

        #gearBtn {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 300;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid rgba(255, 255, 255, 0.7);
            color: #fff;
            width: 50px;
            height: 50px;
            font-size: 26px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(4px);
            transition: 0.2s;
        }
        #gearBtn:hover {
            background: rgba(0, 0, 0, 0.9);
            border-color: #ffcc00;
            transform: rotate(45deg);
        }

        #logoutBtn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            padding: 8px 20px;
            font-size: 14px;
            background: linear-gradient(to bottom, #ff4444, #cc0000);
            border: 2px solid #990000;
            box-shadow: 0 4px 0 #990000;
            border-radius: 20px;
            color: white;
            cursor: pointer;
            font-weight: bold;
            z-index: 250;
        }
        #logoutBtn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #990000;
        }

        #settingsModal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 400;
            backdrop-filter: blur(6px);
        }
        .settings-content {
            background: #222;
            border: 3px solid #558822;
            padding: 30px;
            border-radius: 20px;
            width: 350px;
            text-align: center;
            color: white;
            box-shadow: 0 10px 25px rgba(0,0,0,0.9);
        }
        .settings-content h2 {
            margin-top: 0;
            color: #ffcc00;
        }
        .setting-group {
            margin: 20px 0;
            text-align: left;
        }
        .setting-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        .setting-group select, .setting-group input[type="range"] {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: none;
            background: #333;
            color: white;
            font-size: 16px;
        }
        .close-btn {
            background: #ff3333;
            color: white;
            border: none;
            padding: 10px 25px;
            font-size: 18px;
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }
        .close-btn:hover { background: #ff1a1a; }

        #userInfoPanel {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 250;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid rgba(255, 255, 255, 0.4);
            padding: 8px 15px;
            border-radius: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: white;
            backdrop-filter: blur(4px);
        }
        #userInfoPanel img {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            border: 1px solid #ffcc00;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <div id="gameContainer">
        <!-- Nút Setting bánh răng -->
        <button id="gearBtn" onclick="openSettings()">⚙️</button>

        <!-- Thông tin user góc phải -->
        <div id="userInfoPanel" class="hidden">
            <img id="panelAvatar" src="" alt="Avatar">
            <span id="panelUsername" style="font-weight: bold;">User</span>
        </div>

        <!-- Màn hình Chào mừng ban đầu (Nút PLAY + Ghi chú nhỏ) -->
        <div id="welcomeScreen" class="overlay">
            <h1>ANGRY BIRDS MINI</h1>
            <p>Trò chơi bắn chim phá pháo đài lợn xanh cực đỉnh!</p>
            <button class="btn" style="font-size: 26px; padding: 18px 55px;" onclick="goToAuthScreen()">PLAY</button>
            <div style="font-size: 13px; color: #aaa; margin-top: 12px; font-style: italic;">* Đăng nhập để lưu tiến trình chơi của bạn</div>
        </div>

        <!-- Màn hình Đăng nhập / Tạo tài khoản -->
        <div id="authScreen" class="overlay hidden">
            <h1>ĐĂNG NHẬP</h1>
            
            <div class="input-group">
                <label>Tên tài khoản:</label>
                <input type="text" id="usernameInput" placeholder="Nhập tên của bạn...">
            </div>
            
            <div class="input-group">
                <label>Mật khẩu:</label>
                <input type="password" id="passwordInput" placeholder="Nhập mật khẩu...">
            </div>

            <div class="avatar-upload">
                <img id="avatarPreview" class="avatar-preview" src="" alt="Preview">
                <div>
                    <label style="display:block; margin-bottom:5px; font-weight:bold; color:#ffcc00; text-align:left;">Ảnh Đại Diện:</label>
                    <input type="file" id="avatarFile" accept="image/*" onchange="previewAvatar(event)" style="color: #ccc; font-size: 14px;">
                </div>
            </div>

            <button class="btn" onclick="handleLogin()">VÀO GAME</button>
        </div>

        <!-- Màn hình Chọn Màn Chơi (Level Menu) -->
        <div id="levelMenuScreen" class="overlay hidden">
            <h1>CHỌN MÀN CHƠI</h1>
            <p id="welcomeUserText">Xin chào!</p>
            <div style="display: flex; gap: 15px; flex-wrap: wrap; justify-content: center; margin-bottom: 25px;">
                <button class="btn" id="lvlBtn1" style="padding: 15px 25px;" onclick="startLevel(1)">Màn 1</button>
                <button class="btn locked" id="lvlBtn2" style="padding: 15px 25px;" onclick="startLevel(2)">Màn 2 🔒</button>
                <button class="btn locked" id="lvlBtn3" style="padding: 15px 25px;" onclick="startLevel(3)">Màn 3 🔒</button>
                <button class="btn locked" id="lvlBtn4" style="padding: 15px 25px;" onclick="startLevel(4)">Màn 4 🔒</button>
                <button class="btn locked" id="lvlBtn5" style="padding: 15px 25px;" onclick="startLevel(5)">Màn 5 🔒</button>
            </div>
            <!-- Nút đăng xuất thu nhỏ ở góc dưới phải -->
            <button id="logoutBtn" onclick="logout()">Đăng Xuất</button>
        </div>

        <!-- Bảng Cài đặt Modal -->
        <div id="settingsModal" class="hidden">
            <div class="settings-content">
                <h2>CÀI ĐẶT ÂM THANH</h2>
                
                <div class="setting-group">
                    <label>Chọn Nhạc Nền:</label>
                    <select id="bgMusicSelect" onchange="changeBackgroundMusic()">
                        <option value="angrybird.sound.mp4">Nhạc 1 (angrybird.sound.mp4)</option>
                        <option value="angrybird.sound2.mp4">Nhạc 2 (angrybird.sound2.mp4)</option>
                    </select>
                </div>

                <div class="setting-group">
                    <label>Âm lượng: <span id="volumeValue">50</span>%</label>
                    <input type="range" id="volumeSlider" min="0" max="100" value="50" oninput="updateVolume(this.value)">
                </div>

                <div class="setting-group" style="display: flex; gap: 10px;">
                    <button class="btn" style="flex:1; padding: 10px; font-size: 16px; margin:0;" onclick="toggleMute()" id="muteBtn">Tắt Nhạc</button>
                </div>

                <button class="close-btn" onclick="closeSettings()">Đóng</button>
            </div>
        </div>

        <!-- Màn hình kết quả Thắng / Thua -->
        <div id="gameOverScreen" class="overlay hidden">
            <h1 id="gameOverTitle">CHIẾN THẮNG!</h1>
            <p id="finalScoreText">Tổng điểm tuyệt đối: 0</p>
            <div style="display: flex; gap: 15px;">
                <button class="btn" onclick="startLevel(currentLevel)">CHƠI LẠI</button>
                <button class="btn" style="background: #3388ff; border-color: #1155cc;" onclick="returnToLevelMenu()">CHỌN MÀN</button>
            </div>
        </div>

        <canvas id="gameCanvas"></canvas>
    </div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const welcomeScreen = document.getElementById("welcomeScreen");
const authScreen = document.getElementById("authScreen");
const levelMenuScreen = document.getElementById("levelMenuScreen");
const gameOverScreen = document.getElementById("gameOverScreen");
const gameOverTitle = document.getElementById("gameOverTitle");
const finalScoreText = document.getElementById("finalScoreText");
const settingsModal = document.getElementById("settingsModal");
const volumeSlider = document.getElementById("volumeSlider");
const volumeValue = document.getElementById("volumeValue");
const muteBtn = document.getElementById("muteBtn");
const bgMusicSelect = document.getElementById("bgMusicSelect");
const userInfoPanel = document.getElementById("userInfoPanel");
const panelAvatar = document.getElementById("panelAvatar");
const panelUsername = document.getElementById("panelUsername");
const welcomeUserText = document.getElementById("welcomeUserText");

let currentUser = { username: "", password: "", avatar: "", maxLevelUnlocked: 1 };

window.onload = function() {
    let savedUser = localStorage.getItem("angryBirdsUser");
    if (savedUser) {
        currentUser = JSON.parse(savedUser);
        if (!currentUser.maxLevelUnlocked) currentUser.maxLevelUnlocked = 1;
        
        panelUsername.textContent = currentUser.username;
        if (currentUser.avatar) panelAvatar.src = currentUser.avatar;
        userInfoPanel.classList.remove("hidden");
        welcomeScreen.classList.add("hidden");
        levelMenuScreen.classList.remove("hidden");
        welcomeUserText.textContent = `Xin chào, ${currentUser.username}! Hãy chọn màn chơi:`;
        updateLevelButtons();
    }
}

function goToAuthScreen() {
    welcomeScreen.classList.add("hidden");
    authScreen.classList.remove("hidden");
}

let tempAvatarBase64 = "";
function previewAvatar(event) {
    const file = event.target.files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
            tempAvatarBase64 = e.target.result;
            document.getElementById("avatarPreview").src = tempAvatarBase64;
        }
        reader.readAsDataURL(file);
    }
}

function handleLogin() {
    let username = document.getElementById("usernameInput").value.trim();
    let password = document.getElementById("passwordInput").value.trim();
    if (!username || !password) {
        alert("Vui lòng nhập đầy đủ tên tài khoản và mật khẩu!");
        return;
    }

    // Kiểm tra trùng tên tài khoản đã lưu trong bộ nhớ máy
    let allUsers = JSON.parse(localStorage.getItem("angryBirdsAllUsers") || "{}");
    if (allUsers[username] && allUsers[username] !== password) {
        alert("Tên tài khoản này đã có người sử dụng và mật khẩu không khớp! Vui lòng chọn tên khác.");
        return;
    }

    allUsers[username] = password;
    localStorage.setItem("angryBirdsAllUsers", JSON.stringify(allUsers));

    currentUser.username = username;
    currentUser.password = password;
    if (tempAvatarBase64) currentUser.avatar = tempAvatarBase64;
    if (!currentUser.maxLevelUnlocked) currentUser.maxLevelUnlocked = 1;

    localStorage.setItem("angryBirdsUser", JSON.stringify(currentUser));

    panelUsername.textContent = currentUser.username;
    if (currentUser.avatar) panelAvatar.src = currentUser.avatar;
    userInfoPanel.classList.remove("hidden");

    authScreen.classList.add("hidden");
    levelMenuScreen.classList.remove("hidden");
    welcomeUserText.textContent = `Xin chào, ${currentUser.username}! Hãy chọn màn chơi:`;
    updateLevelButtons();
}

function logout() {
    localStorage.removeItem("angryBirdsUser");
    location.reload();
}

function returnToLevelMenu() {
    gameOverScreen.classList.add("hidden");
    levelMenuScreen.classList.remove("hidden");
    gameState = "MENU";
    updateLevelButtons();
}

function updateLevelButtons() {
    for (let i = 1; i <= 5; i++) {
        let btn = document.getElementById(`lvlBtn${i}`);
        if (i <= currentUser.maxLevelUnlocked) {
            btn.classList.remove("locked");
            btn.textContent = `Màn ${i}`;
        } else {
            btn.classList.add("locked");
            btn.textContent = `Màn ${i} 🔒`;
        }
    }
}

let currentMusicFile = "angrybird.sound.mp4";
let bgMusic = new Audio(currentMusicFile);
bgMusic.loop = true;
bgMusic.volume = 0.5;

const victorySound = new Audio("victorysound.mp4");
victorySound.volume = 0.7;

let isMuted = false;

function openSettings() { settingsModal.classList.remove("hidden"); }
function closeSettings() { settingsModal.classList.add("hidden"); }

function changeBackgroundMusic() {
    let selectedFile = bgMusicSelect.value;
    bgMusic.pause();
    currentMusicFile = selectedFile;
    bgMusic = new Audio(currentMusicFile);
    bgMusic.loop = true;
    bgMusic.volume = volumeSlider.value / 100;
    if (!isMuted && gameState === "PLAYING") {
        bgMusic.play().catch(e => console.log(e));
    }
}

function updateVolume(val) {
    volumeValue.textContent = val;
    let vol = val / 100;
    bgMusic.volume = vol;
    victorySound.volume = vol;
    if (val > 0 && isMuted) {
        isMuted = false;
        muteBtn.textContent = "Tắt Nhạc";
        muteBtn.style.background = "linear-gradient(to bottom, #8ddb44, #558822)";
    }
}

function toggleMute() {
    isMuted = !isMuted;
    if (isMuted) {
        bgMusic.pause();
        victorySound.pause();
        muteBtn.textContent = "Bật Nhạc";
        muteBtn.style.background = "#ff3333";
    } else {
        muteBtn.textContent = "Tắt Nhạc";
        muteBtn.style.background = "linear-gradient(to bottom, #8ddb44, #558822)";
        if (gameState === "PLAYING") {
            bgMusic.play().catch(e => console.log(e));
        }
    }
}

// Tải đúng file background.angrybird.jpg[cite: 13]
const bgImage = new Image();
bgImage.src = "background.angrybird.jpg";

let gameState = "MENU"; 
let currentLevel = 1;
let score = 0;
let lives = 3;
let groundY = 0;
let scale = 1;

let sling = { x: 0, y: 0 };
let bird = { x: 0, y: 0, radius: 18, vx: 0, vy: 0, isDragging: false, isLaunched: false };
let targets = [];
let groundHills = [];

function resizeCanvas() {
    canvas.width = canvas.parentElement.clientWidth;
    canvas.height = canvas.parentElement.clientHeight;

    let scaleX = canvas.width / 1400;
    let scaleY = canvas.height / 650;
    scale = Math.min(scaleX, scaleY);
    if (scale < 0.6) scale = 0.6;

    groundY = canvas.height - 90 * scale;
    sling.x = canvas.width * 0.15;
    sling.y = groundY - 100 * scale;

    if (!bird.isLaunched && !bird.isDragging) {
        bird.x = sling.x;
        bird.y = sling.y;
    }

    bird.radius = 18 * scale;

    groundHills = [
        { x: canvas.width * 0.62, w: 260 * scale, h: 45 * scale },
        { x: canvas.width * 0.82, w: 220 * scale, h: 60 * scale }
    ];
}

function loadLevel(lvl) {
    currentLevel = lvl;
    resizeCanvas();
    const startX = canvas.width * 0.65;
    
    const longW = 110 * scale;
    const longThinH = 18 * scale; 
    const blockW = 45 * scale;
    const blockH = 65 * scale;

    if (lvl === 1) {
        targets = [
            { type: "wood", x: startX, y: groundY - blockH, width: blockW, height: blockH, alive: true, health: 2, maxHealth: 2, vy: 0, onGround: true },
            { type: "pig", x: startX + blockW/2, y: groundY - blockH - 22 * scale, alive: true, radius: 22 * scale, vy: 0, onGround: true },
            { type: "ice", x: startX - 10 * scale, y: groundY - blockH - 25 * scale, width: longW, height: longThinH, alive: true, health: 1, maxHealth: 1, vy: 0, onGround: true },
            { type: "pig", x: startX + blockW + 40 * scale, y: groundY - 22 * scale, alive: true, radius: 22 * scale, vy: 0, onGround: true }
        ];
    } else if (lvl === 2) {
        targets = [
            { type: "wood", x: startX, y: groundY - blockH, width: blockW, height: blockH, alive: true, health: 2, maxHealth: 2, vy: 0, onGround: true },
            { type: "wood", x: startX + 70 * scale, y: groundY - blockH, width: blockW, height: blockH, alive: true, health: 2, maxHealth: 2, vy: 0, onGround: true },
            { type: "stone", x: startX - 15 * scale, y: groundY - blockH - longThinH, width: longW + 30 * scale, height: longThinH, alive: true, health: 3, maxHealth: 3, vy: 0, onGround: false },
            { type: "pig", x: startX + 35 * scale, y: groundY - blockH - 45 * scale, alive: true, radius: 22 * scale, vy: 0, onGround: false },
            { type: "pig", x: startX + 35 * scale, y: groundY - 22 * scale, alive: true, radius: 22 * scale, vy: 0, onGround: true }
        ];
    } else if (lvl === 3) {
        let hillTopY = groundY - 45 * scale;
        targets = [
            { type: "stone", x: startX, y: hillTopY - blockH, width: blockW, height: blockH, alive: true, health: 3, maxHealth: 3, vy: 0, onGround: true },
            { type: "stone", x: startX + 80 * scale, y: hillTopY - blockH, width: blockW, height: blockH, alive: true, health: 3, maxHealth: 3, vy: 0, onGround: true },
            { type: "wood", x: startX - 10 * scale, y: hillTopY - blockH - longThinH, width: longW + 20 * scale, height: longThinH, alive: true, health: 2, maxHealth: 2, vy: 0, onGround: false },
            { type: "pig", x: startX + 40 * scale, y: hillTopY - blockH - 40 * scale, alive: true, radius: 22 * scale, vy: 0, onGround: false },
            { type: "pig", x: startX + 120 * scale, y: hillTopY - 22 * scale, alive: true, radius: 22 * scale, vy: 0, onGround: true }
        ];
    } else if (lvl === 4) {
        targets = [
            { type: "wood", x: startX + 30 * scale, y: groundY - blockH, width: blockW, height: blockH, alive: true, health: 2, maxHealth: 2, vy: 0, onGround: true },
            { type: "ice", x: startX, y: groundY - blockH - longThinH, width: longW, height: longThinH, alive: true, health: 1, maxHealth: 1, vy: 0, onGround: false },
            { type: "pig", x: startX + 50 * scale, y: groundY - blockH - 35 * scale, alive: true, radius: 22 * scale, vy: 0, onGround: false },
            { type: "stone", x: startX + 15 * scale, y: groundY - blockH * 2 - longThinH, width: 80 * scale, height: longThinH, alive: true, health: 3, maxHealth: 3, vy: 0, onGround: false },
            { type: "pig", x: startX + 55 * scale, y: groundY - blockH * 2 - 60 * scale, alive: true, radius: 22 * scale, vy: 0, onGround: false }
        ];
    } else if (lvl === 5) {
        let hillTopY2 = groundY - 60 * scale;
        targets = [
            { type: "stone", x: startX - 20 * scale, y: hillTopY2 - blockH, width: blockW, height: blockH, alive: true, health: 3, maxHealth: 3, vy: 0, onGround: true },
            { type: "stone", x: startX + 60 * scale, y: hillTopY2 - blockH, width: blockW, height: blockH, alive: true, health: 3, maxHealth: 3, vy: 0, onGround: true },
            { type: "wood", x: startX - 35 * scale, y: hillTopY2 - blockH - longThinH, width: longW + 50 * scale, height: longThinH, alive: true, health: 2, maxHealth: 2, vy: 0, onGround: false },
            { type: "pig", x: startX + 20 * scale, y: hillTopY2 - blockH - 40 * scale, alive: true, radius: 22 * scale, vy: 0, onGround: false },
            { type: "pig", x: startX - 10 * scale, y: hillTopY2 - 22 * scale, alive: true, radius: 22 * scale, vy: 0, onGround: true },
            { type: "pig", x: startX + 80 * scale, y: hillTopY2 - 22 * scale, alive: true, radius: 22 * scale, vy: 0, onGround: true }
        ];
    }
}

function startLevel(lvl) {
    if (lvl > currentUser.maxLevelUnlocked) {
        alert("Bạn cần phải vượt qua màn trước để mở khóa màn này!");
        return;
    }
    gameState = "PLAYING";
    score = 0;
    lives = 3;
    levelMenuScreen.classList.add("hidden");
    gameOverScreen.classList.add("hidden");
    loadLevel(lvl);
    resetBird();

    victorySound.pause();
    victorySound.currentTime = 0;

    if (!isMuted) {
        bgMusic.currentTime = 0;
        bgMusic.play().catch(e => console.log(e));
    }
}

function endGame(isWin) {
    gameState = "GAMEOVER";
    gameOverScreen.classList.remove("hidden");
    bgMusic.pause();

    if (isWin) {
        gameOverTitle.textContent = "CHIẾN THẮNG MÀN " + currentLevel + "!";
        gameOverTitle.style.color = "#8ddb44";
        finalScoreText.innerHTML = "Tổng điểm đạt được: " + score;

        if (currentLevel >= currentUser.maxLevelUnlocked && currentLevel < 5) {
            currentUser.maxLevelUnlocked = currentLevel + 1;
            localStorage.setItem("angryBirdsUser", JSON.stringify(currentUser));
        }

        if (!isMuted) {
            victorySound.currentTime = 0;
            victorySound.play().catch(e => console.log(e));
        }
    } else {
        gameOverTitle.textContent = "HẾT LƯỢT BẮN!";
        gameOverTitle.style.color = "#ff3333";
        finalScoreText.innerHTML = "Điểm số đạt được: " + score;
    }
}

function resetBird() {
    bird.x = sling.x;
    bird.y = sling.y;
    bird.vx = 0;
    bird.vy = 0;
    bird.isLaunched = false;
    bird.isDragging = false;
}

function getPointerPos(e) {
    const rect = canvas.getBoundingClientRect();
    let clientX = e.clientX;
    let clientY = e.clientY;
    if (e.touches && e.touches.length > 0) {
        clientX = e.touches[0].clientX;
        clientY = e.touches[0].clientY;
    }
    return { x: clientX - rect.left, y: clientY - rect.top };
}

function onTouchStart(e) {
    if (gameState !== "PLAYING" || bird.isLaunched || lives <= 0) return;
    const pos = getPointerPos(e);
    if (Math.hypot(pos.x - bird.x, pos.y - bird.y) < bird.radius + 30) {
        bird.isDragging = true;
    }
}

function onTouchMove(e) {
    if (!bird.isDragging) return;
    const pos = getPointerPos(e);
    const dx = pos.x - sling.x;
    const dy = pos.y - sling.y;
    const dist = Math.hypot(dx, dy);
    const maxDrag = 110 * scale;

    let angle = Math.atan2(dy, dx);
    let currentDist = Math.min(dist, maxDrag);

    bird.x = sling.x + Math.cos(angle) * currentDist;
    bird.y = sling.y + Math.sin(angle) * currentDist;
}

function onTouchEnd() {
    if (!bird.isDragging) return;
    bird.isDragging = false;
    bird.isLaunched = true;

    bird.vx = (sling.x - bird.x) * 0.23;
    bird.vy = (sling.y - bird.y) * 0.23;
}

window.addEventListener("mousedown", onTouchStart);
window.addEventListener("mousemove", onTouchMove);
window.addEventListener("mouseup", onTouchEnd);

canvas.addEventListener("touchstart", onTouchStart, { passive: true });
canvas.addEventListener("touchmove", onTouchMove, { passive: true });
window.addEventListener("touchend", onTouchEnd);
window.addEventListener("resize", resizeCanvas);

function checkCollision(b, t) {
    if (!t.alive) return false;
    if (t.type === "pig") {
        return Math.hypot(b.x - t.x, b.y - t.y) < b.radius + t.radius;
    } else {
        let closestX = Math.max(t.x, Math.min(b.x, t.x + t.width));
        let closestY = Math.max(t.y, Math.min(b.y, t.y + t.height));
        return Math.hypot(b.x - closestX, b.y - closestY) < b.radius;
    }
}

function drawBird(x, y, r) {
    ctx.fillStyle = "#e62e00";
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#991400";
    ctx.lineWidth = 2 * scale;
    ctx.stroke();

    ctx.fillStyle = "#fff";
    ctx.beginPath();
    ctx.arc(x + r*0.35, y - r*0.15, r*0.3, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#000";
    ctx.beginPath();
    ctx.arc(x + r*0.45, y - r*0.15, r*0.1, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#ffb800";
    ctx.beginPath();
    ctx.moveTo(x + r*0.7, y);
    ctx.lineTo(x + r*1.2, y + r*0.1);
    ctx.lineTo(x + r*0.7, y + r*0.25);
    ctx.closePath();
    ctx.fill();
}

function drawPig(x, y, r) {
    ctx.save();
    ctx.translate(x, y);

    ctx.strokeStyle = "#000000";
    ctx.lineWidth = 2.2 * scale;

    ctx.fillStyle = "#6fc525";
    ctx.beginPath();
    ctx.arc(-r * 0.42, -r * 0.78, r * 0.3, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = "#559c19";
    ctx.beginPath();
    ctx.arc(-r * 0.42, -r * 0.78, r * 0.13, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#6fc525";
    ctx.beginPath();
    ctx.arc(r * 0.42, -r * 0.78, r * 0.3, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = "#559c19";
    ctx.beginPath();
    ctx.arc(r * 0.42, -r * 0.78, r * 0.13, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#7acc29";
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = "#559c19";
    ctx.beginPath();
    ctx.arc(-r * 0.52, -r * 0.3, r * 0.16, Math.PI, 0, false);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(r * 0.52, -r * 0.3, r * 0.16, Math.PI, 0, false);
    ctx.fill();

    let timeSec = Date.now() / 400;
    let isBlinking = (Math.sin(timeSec + x) > 0.85);

    let eyeRadius = r * 0.28;
    let eyeOffsetX = r * 0.46;

    ctx.fillStyle = "#ffffff";
    ctx.beginPath();
    ctx.arc(-eyeOffsetX, -r * 0.15, eyeRadius, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    if (!isBlinking) {
        ctx.fillStyle = "#000000";
        ctx.beginPath();
        ctx.arc(-eyeOffsetX + r * 0.05, -r * 0.15, r * 0.08, 0, Math.PI * 2);
        ctx.fill();
    } else {
        ctx.strokeStyle = "#000";
        ctx.lineWidth = 2.5 * scale;
        ctx.beginPath();
        ctx.arc(-eyeOffsetX, -r * 0.05, eyeRadius * 0.6, Math.PI, 0, false);
        ctx.stroke();
    }

    ctx.fillStyle = "#ffffff";
    ctx.beginPath();
    ctx.arc(eyeOffsetX, -r * 0.15, eyeRadius, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    if (!isBlinking) {
        ctx.fillStyle = "#000000";
        ctx.beginPath();
        ctx.arc(eyeOffsetX - r * 0.05, -r * 0.15, r * 0.08, 0, Math.PI * 2);
        ctx.fill();
    } else {
        ctx.strokeStyle = "#000";
        ctx.lineWidth = 2.5 * scale;
        ctx.beginPath();
        ctx.arc(eyeOffsetX, -r * 0.05, eyeRadius * 0.6, Math.PI, 0, false);
        ctx.stroke();
    }

    ctx.fillStyle = "#8fe038";
    ctx.beginPath();
    ctx.ellipse(0, r * 0.18, r * 0.45, r * 0.35, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = "#2d570c";
    ctx.beginPath();
    ctx.arc(-r * 0.13, r * 0.16, r * 0.07, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(r * 0.13, r * 0.16, r * 0.07, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = "#2d570c";
    ctx.lineWidth = 2 * scale;
    ctx.beginPath();
    ctx.arc(0, r * 0.3, r * 0.2, 0.1, Math.PI - 0.1, false);
    ctx.stroke();

    ctx.restore();
}

// Vẽ hoạt ảnh nứt nẻ rạn vỡ (Damage / Cracking Animation) trực tiếp lên Canvas
function drawCracks(t) {
    if (t.health < t.maxHealth) {
        ctx.strokeStyle = "#000";
        ctx.lineWidth = 1.5 * scale;
        ctx.beginPath();
        if (t.type === "pig") {
            ctx.moveTo(t.x - t.radius*0.3, t.y - t.radius*0.3);
            ctx.lineTo(t.x + t.radius*0.2, t.y + t.radius*0.1);
            if (t.health === 1 && t.maxHealth >= 3) {
                ctx.moveTo(t.x + t.radius*0.3, t.y - t.radius*0.2);
                ctx.lineTo(t.x - t.radius*0.1, t.y + t.radius*0.3);
            }
        } else {
            ctx.moveTo(t.x + t.width*0.2, t.y);
            ctx.lineTo(t.x + t.width*0.5, t.y + t.height*0.6);
            if (t.health === 1 && t.maxHealth >= 3) {
                ctx.lineTo(t.x + t.width*0.8, t.y + t.height);
            }
        }
        ctx.stroke();
    }
}
