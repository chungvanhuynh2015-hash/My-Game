<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Dune Buggy - Hill Climb Racing</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #73c2fb;
      font-family: 'Arial Black', Impact, sans-serif;
    }
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Top Stats Bar */
    .top-bar {
      position: absolute;
      top: 15px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 10;
    }

    .distance-badge {
      background: rgba(0, 0, 0, 0.6);
      border: 3px solid #ffcc00;
      border-radius: 12px;
      padding: 8px 18px;
      color: #fff;
      font-size: 22px;
      text-shadow: 2px 2px 0px #000;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    .distance-badge span {
      color: #ffcc00;
    }

    /* HUD Dashboard (Center Bottom) */
    .dashboard {
      position: absolute;
      bottom: 15px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: flex-end;
      gap: 15px;
      z-index: 10;
      pointer-events: none;
    }

    .gauge-container {
      position: relative;
      width: 110px;
      height: 110px;
      background: radial-gradient(circle, #222 60%, #000 100%);
      border: 4px solid #444;
      border-radius: 50%;
      box-shadow: inset 0 0 10px #000, 0 4px 12px rgba(0,0,0,0.8);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .gauge-center {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      border: 2px solid #555;
      position: relative;
      background: #151515;
    }

    .gauge-title {
      position: absolute;
      bottom: 20px;
      width: 100%;
      text-align: center;
      font-size: 11px;
      color: #aaa;
      letter-spacing: 1px;
    }

    .gauge-value {
      position: absolute;
      bottom: 35px;
      width: 100%;
      text-align: center;
      font-size: 13px;
      color: #00ffcc;
      text-shadow: 0 0 5px #00ffcc;
    }

    .needle {
      position: absolute;
      bottom: 50%;
      left: calc(50% - 2px);
      width: 4px;
      height: 38px;
      background: #ff3333;
      border-radius: 2px;
      transform-origin: bottom center;
      transform: rotate(-120deg);
      transition: transform 0.1s ease-out;
      box-shadow: 0 0 4px #ff0000;
    }

    .needle::after {
      content: '';
      position: absolute;
      bottom: -4px;
      left: -3px;
      width: 10px;
      height: 10px;
      background: #888;
      border-radius: 50%;
    }

    .fuel-gauge {
      width: 90px;
      height: 90px;
    }
    .fuel-gauge .needle {
      height: 30px;
    }

    /* Pedals */
    .pedal {
      position: absolute;
      bottom: 20px;
      width: 90px;
      height: 140px;
      background: linear-gradient(135deg, #444 0%, #222 100%);
      border: 4px solid #666;
      border-radius: 18px;
      box-shadow: 0 8px 15px rgba(0,0,0,0.7), inset 0 2px 5px rgba(255,255,255,0.2);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      z-index: 20;
      touch-action: manipulation;
    }

    .pedal:active, .pedal.active {
      transform: translateY(6px);
      box-shadow: 0 2px 5px rgba(0,0,0,0.7);
      background: linear-gradient(135deg, #333 0%, #111 100%);
    }

    .pedal-brake {
      left: 25px;
      border-color: #e74c3c;
    }

    .pedal-gas {
      right: 25px;
      border-color: #2ecc71;
    }

    .pedal-grip {
      width: 70%;
      height: 10px;
      background: #111;
      margin: 4px 0;
      border-radius: 4px;
      box-shadow: inset 0 1px 2px #000;
    }

    .pedal-label {
      color: #fff;
      font-size: 14px;
      margin-top: 8px;
      text-shadow: 1px 1px 2px #000;
    }

    /* Game Over Modal */
    #game-over-modal {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
      color: #fff;
    }

    #game-over-modal h1 {
      font-size: 48px;
      color: #ff3333;
      text-shadow: 3px 3px 0 #000;
      margin-bottom: 10px;
    }

    #game-over-reason {
      font-size: 20px;
      color: #ffcc00;
      margin-bottom: 25px;
    }

    .restart-btn {
      padding: 15px 40px;
      font-size: 24px;
      font-family: inherit;
      background: #2ecc71;
      color: #fff;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 6px 0 #27ae60;
      transition: all 0.1s;
    }

    .restart-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #27ae60;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <!-- Top Bar -->
    <div class="top-bar">
      <div class="distance-badge">Quãng đường: <span id="dist-val">0</span> m</div>
    </div>

    <!-- Dashboard Gauges -->
    <div class="dashboard">
      <div class="gauge-container">
        <div class="gauge-center">
          <div class="needle" id="rpm-needle"></div>
          <div class="gauge-value" id="rpm-val">0</div>
          <div class="gauge-title">RPM</div>
        </div>
      </div>

      <div class="gauge-container fuel-gauge">
        <div class="gauge-center">
          <div class="needle" id="fuel-needle"></div>
          <div class="gauge-value" id="fuel-val" style="color:#2ecc71">100%</div>
          <div class="gauge-title">FUEL</div>
        </div>
      </div>

      <div class="gauge-container">
        <div class="gauge-center">
          <div class="needle" id="speed-needle"></div>
          <div class="gauge-value" id="speed-val">0</div>
          <div class="gauge-title">SPEED</div>
        </div>
      </div>
    </div>

    <!-- Pedals -->
    <div class="pedal pedal-brake" id="btn-brake">
      <div class="pedal-grip"></div>
      <div class="pedal-grip"></div>
      <div class="pedal-grip"></div>
      <div class="pedal-label">LÙI / PHANH</div>
    </div>

    <div class="pedal pedal-gas" id="btn-gas">
      <div class="pedal-grip"></div>
      <div class="pedal-grip"></div>
      <div class="pedal-grip"></div>
      <div class="pedal-label">GA</div>
    </div>

    <!-- Game Over Screen -->
    <div id="game-over-modal">
      <h1>GAME OVER!</h1>
      <div id="game-over-reason">Lật xe chạm đầu!</div>
      <button class="restart-btn" onclick="restartGame()">THỬ LẠI</button>
    </div>
  </div>

  <script>
    const { Engine, Render, Runner, Bodies, Composite, Constraint, Body, Events } = Matter;

    // Game Constants & State
    const FUEL_MAX_TIME = 45; // 45 seconds
    let fuelTimeLeft = FUEL_MAX_TIME;
    let distance = 0;
    let isGameOver = false;
    let gasPressed = false;
    let brakePressed = false;

    // Matter Engine
    const container = document.getElementById('game-container');
    const engine = Engine.create({ enableSleeping: false });
    engine.world.gravity.y = 1.25;

    const render = Render.create({
      element: container,
      engine: engine,
      options: {
        width: window.innerWidth,
        height: window.innerHeight,
        wireframes: false,
        background: 'transparent'
      }
    });

    Render.run(render);
    const runner = Runner.create();
    Runner.run(runner, engine);

    // Procedural Terrain Points
    const terrainPoints = [];
    const terrainSegments = [];
    const segmentWidth = 40;
    let lastX = -400;
    let startY = window.innerHeight * 0.65;
    let lastY = startY;

    function generateTerrain(toX) {
      if (terrainPoints.length === 0) {
        terrainPoints.push({ x: lastX, y: lastY });
      }

      while (lastX < toX) {
        let nextX = lastX + segmentWidth;
        let nextY = lastY;

        // TẠO ĐOẠN ĐẦU PHẲNG (~600px đầu tiên)
        if (nextX < 600) {
          nextY = startY;
        } else {
          // Bắt đầu tạo đồi núi sau đoạn xuất phát
          const hillX = nextX - 600;
          nextY = startY + (Math.sin(hillX * 0.007) * 45) + (Math.cos(hillX * 0.018) * 25);
        }

        terrainPoints.push({ x: nextX, y: nextY });

        let ground = Bodies.rectangle(
          (lastX + nextX) / 2,
          (lastY + nextY) / 2 + 15,
          segmentWidth + 5,
          600,
          {
            isStatic: true,
            friction: 0.95,
            render: { visible: false }
          }
        );

        const angle = Math.atan2(nextY - lastY, nextX - lastX);
        Body.setAngle(ground, angle);

        Composite.add(engine.world, ground);
        terrainSegments.push(ground);

        lastX = nextX;
        lastY = nextY;
      }
    }

    // Vehicle Setup
    let car, rearWheel, frontWheel, driverHead;

    function createVehicle(startX, startY) {
      car = Bodies.rectangle(startX, startY, 130, 38, {
        density: 0.004,
        friction: 0.8,
        restitution: 0.05,
        collisionFilter: { group: -1 },
        render: { fillStyle: '#2ecc71' }
      });

      driverHead = Bodies.circle(startX - 10, startY - 35, 16, {
        density: 0.001,
        collisionFilter: { group: -1 },
        render: { fillStyle: '#e67e22' }
      });

      const neckJoint = Constraint.create({
        bodyA: car,
        bodyB: driverHead,
        pointA: { x: -10, y: -28 },
        pointB: { x: 0, y: 0 },
        stiffness: 0.85,
        length: 0,
        render: { visible: false }
      });

      const wheelOptions = {
        friction: 1.1,
        density: 0.005,
        restitution: 0.1,
        collisionFilter: { group: -1 },
        render: { fillStyle: '#111', strokeStyle: '#444', lineWidth: 6 }
      };

      rearWheel = Bodies.circle(startX - 45, startY + 25, 24, wheelOptions);
      frontWheel = Bodies.circle(startX + 45, startY + 25, 24, wheelOptions);

      const rearAxle = Constraint.create({
        bodyA: car,
        bodyB: rearWheel,
        pointA: { x: -45, y: 20 },
        stiffness: 0.22,
        damping: 0.05,
        render: { strokeStyle: '#222', lineWidth: 5 }
      });

      const frontAxle = Constraint.create({
        bodyA: car,
        bodyB: frontWheel,
        pointA: { x: 45, y: 20 },
        stiffness: 0.22,
        damping: 0.05,
        render: { strokeStyle: '#222', lineWidth: 5 }
      });

      Composite.add(engine.world, [car, driverHead, neckJoint, rearWheel, frontWheel, rearAxle, frontAxle]);
    }

    // Khởi tạo mặt đường và xe đặt ở đoạn phẳng
    generateTerrain(window.innerWidth + 1200);
    createVehicle(100, startY - 80);

    // Render đồ họa nền & mặt đường
    Events.on(render, 'beforeRender', () => {
      const ctx = render.context;
      const width = render.canvas.width;
      const height = render.canvas.height;

      // 1. Sky Gradient
      const skyGrad = ctx.createLinearGradient(0, 0, 0, height);
      skyGrad.addColorStop(0, '#50b5fd');
      skyGrad.addColorStop(0.6, '#a1dbff');
      skyGrad.addColorStop(1, '#e3f4ff');
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, width, height);

      const camX = render.bounds.min.x;

      // 2. Parallax Clouds
      ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
      for (let i = -2; i < 10; i++) {
        let cloudX = i * 400 - (camX * 0.1) % 400;
        ctx.beginPath();
        ctx.arc(cloudX, 90, 45, 0, Math.PI * 2);
        ctx.arc(cloudX + 35, 75, 55, 0, Math.PI * 2);
        ctx.arc(cloudX + 80, 90, 40, 0, Math.PI * 2);
        ctx.fill();
      }

      // 3. Parallax Mountains
      ctx.fillStyle = '#82ca9c';
      for (let i = -2; i < 8; i++) {
        let mtnX = i * 600 - (camX * 0.25) % 600;
        ctx.beginPath();
        ctx.moveTo(mtnX - 200, height);
        ctx.quadraticCurveTo(mtnX, height - 380, mtnX + 250, height);
        ctx.fill();
      }

      ctx.fillStyle = '#6cb788';
      for (let i = -2; i < 8; i++) {
        let mtnX = i * 500 + 200 - (camX * 0.35) % 500;
        ctx.beginPath();
        ctx.moveTo(mtnX - 180, height);
        ctx.quadraticCurveTo(mtnX, height - 280, mtnX + 200, height);
        ctx.fill();
      }
    });

    Events.on(render, 'afterRender', () => {
      const ctx = render.context;

      // Render đường 3 tầng
      if (terrainPoints.length > 1) {
        ctx.save();

        // Tầng 3: Lòng đất rêu đậm
        ctx.fillStyle = '#2f571b';
        ctx.beginPath();
        ctx.moveTo(terrainPoints[0].x, terrainPoints[0].y + 35);
        for (let i = 1; i < terrainPoints.length; i++) {
          ctx.lineTo(terrainPoints[i].x, terrainPoints[i].y + 35);
        }
        ctx.lineTo(terrainPoints[terrainPoints.length - 1].x, terrainPoints[terrainPoints.length - 1].y + 1000);
        ctx.lineTo(terrainPoints[0].x, terrainPoints[0].y + 1000);
        ctx.closePath();
        ctx.fill();

        // Tầng 2: Cát/đất vàng
        ctx.fillStyle = '#d1b838';
        ctx.beginPath();
        ctx.moveTo(terrainPoints[0].x, terrainPoints[0].y + 8);
        for (let i = 1; i < terrainPoints.length; i++) {
          ctx.lineTo(terrainPoints[i].x, terrainPoints[i].y + 8);
        }
        for (let i = terrainPoints.length - 1; i >= 0; i--) {
          ctx.lineTo(terrainPoints[i].x, terrainPoints[i].y + 35);
        }
        ctx.closePath();
        ctx.fill();

        // Tầng 1: Cỏ xanh nhạt
        ctx.fillStyle = '#54aa2b';
        ctx.beginPath();
        ctx.moveTo(terrainPoints[0].x, terrainPoints[0].y - 3);
        for (let i = 1; i < terrainPoints.length; i++) {
          ctx.lineTo(terrainPoints[i].x, terrainPoints[i].y - 3);
        }
        for (let i = terrainPoints.length - 1; i >= 0; i--) {
          ctx.lineTo(terrainPoints[i].x, terrainPoints[i].y + 8);
        }
        ctx.closePath();
        ctx.fill();

        ctx.restore();
      }

      // Vẽ xe & nhân vật
      if (car) {
        // Bảng tên "Toansigma"
        ctx.save();
        ctx.translate(car.position.x, car.position.y - 75);
        ctx.fillStyle = '#e74c3c';
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.font = 'bold 15px Arial';
        const text = "Toansigma";
        const width = ctx.measureText(text).width + 16;
        ctx.fillRect(-width/2, -12, width, 24);
        ctx.strokeRect(-width/2, -12, width, 24);
        ctx.fillStyle = '#fff';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(text, 0, 0);
        ctx.restore();

        // Đầu & Mũ bảo hiểm
        ctx.save();
        ctx.translate(driverHead.position.x, driverHead.position.y);
        ctx.rotate(driverHead.angle);
        ctx.fillStyle = '#c0392b';
        ctx.beginPath();
        ctx.arc(0, -3, 17, Math.PI, 0);
        ctx.fill();
        ctx.fillRect(4, -6, 16, 5);
        ctx.fillStyle = '#666';
        ctx.beginPath();
        ctx.arc(4, 6, 9, 0, Math.PI / 2);
        ctx.fill();
        ctx.restore();

        // Khung xe & Cờ
        ctx.save();
        ctx.translate(car.position.x, car.position.y);
        ctx.rotate(car.angle);
        ctx.strokeStyle = '#ecf0f1';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(-50, -10);
        ctx.lineTo(-20, -45);
        ctx.lineTo(20, -45);
        ctx.lineTo(50, -10);
        ctx.stroke();

        ctx.fillStyle = '#7f8c8d';
        ctx.fillRect(-70, -10, 20, 8);
        ctx.strokeStyle = '#333';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-60, -10);
        ctx.lineTo(-60, -55);
        ctx.stroke();
        ctx.fillStyle = '#e74c3c';
        ctx.beginPath();
        ctx.moveTo(-60, -55);
        ctx.lineTo(-40, -48);
        ctx.lineTo(-60, -40);
        ctx.fill();
        ctx.restore();
      }
    });

    // Camera đi theo xe
    Events.on(render, 'beforeRender', () => {
      if (!car) return;
      Render.lookAt(render, {
        min: { x: car.position.x - window.innerWidth * 0.35, y: car.position.y - window.innerHeight * 0.55 },
        max: { x: car.position.x + window.innerWidth * 0.65, y: car.position.y + window.innerHeight * 0.45 }
      });

      if (car.position.x + window.innerWidth > lastX) {
        generateTerrain(car.position.x + window.innerWidth + 800);
      }
    });

    // Vòng lặp vật lý & điều khiển
    let lastTimestamp = performance.now();

    Events.on(engine, 'beforeUpdate', () => {
      if (isGameOver) return;

      const now = performance.now();
      const delta = (now - lastTimestamp) / 1000;
      lastTimestamp = now;

      // 1. Trừ nhiên liệu (45 giây)
      fuelTimeLeft = Math.max(0, fuelTimeLeft - delta);
      const fuelPercent = Math.floor((fuelTimeLeft / FUEL_MAX_TIME) * 100);

      document.getElementById('fuel-val').innerText = fuelPercent + '%';
      document.getElementById('fuel-needle').style.transform = `rotate(${-120 + (fuelPercent / 100) * 240}deg)`;
      document.getElementById('fuel-val').style.color = fuelPercent < 20 ? '#e74c3c' : '#2ecc71';

      if (fuelTimeLeft <= 0) {
        triggerGameOver("Hết nhiên liệu!");
        return;
      }

      // 2. Điều khiển Ga / Phanh
      const speed = Body.getVelocity(car).x;
      let rpm = Math.abs(speed) * 150;

      if (gasPressed) {
        Body.setAngularVelocity(rearWheel, 0.32);
        Body.setAngularVelocity(frontWheel, 0.32);
        Body.applyForce(car, car.position, { x: 0.0022, y: 0 });
        rpm += 1300;
      } else if (brakePressed) {
        Body.setAngularVelocity(rearWheel, -0.22);
        Body.setAngularVelocity(frontWheel, -0.22);
        Body.applyForce(car, car.position, { x: -0.0016, y: 0 });
        rpm += 850;
      }

      // 3. Cập nhật đồng hồ
      const displaySpeed = Math.max(0, Math.floor(speed * 3.6));
      document.getElementById('speed-val').innerText = displaySpeed;
      document.getElementById('speed-needle').style.transform = `rotate(${-120 + Math.min(240, displaySpeed * 3)}deg)`;

      const displayRpm = Math.floor(Math.min(8000, rpm));
      document.getElementById('rpm-val').innerText = displayRpm;
      document.getElementById('rpm-needle').style.transform = `rotate(${-120 + (displayRpm / 8000) * 240}deg)`;

      // 4. Quãng đường
      distance = Math.max(distance, Math.floor((car.position.x - 100) / 10));
      document.getElementById('dist-val').innerText = distance;
    });

    // Phát hiện lật xe chạm đầu
    Events.on(engine, 'collisionStart', (event) => {
      if (isGameOver) return;
      event.pairs.forEach(pair => {
        const { bodyA, bodyB } = pair;
        const isHeadInvolved = (bodyA === driverHead || bodyB === driverHead);
        const isGroundInvolved = terrainSegments.includes(bodyA) || terrainSegments.includes(bodyB);

        if (isHeadInvolved && isGroundInvolved) {
          triggerGameOver("Lật xe chạm đầu!");
        }
      });
    });

    function triggerGameOver(reason) {
      if (isGameOver) return;
      isGameOver = true;
      document.getElementById('game-over-reason').innerText = reason;
      document.getElementById('game-over-modal').style.display = 'flex';
    }

    function restartGame() {
      location.reload();
    }

    // Sự kiện bàn phím & Cảm ứng
    const btnGas = document.getElementById('btn-gas');
    const btnBrake = document.getElementById('btn-brake');

    const bindControl = (element, onPress, onRelease) => {
      element.addEventListener('mousedown', onPress);
      element.addEventListener('mouseup', onRelease);
      element.addEventListener('mouseleave', onRelease);
      element.addEventListener('touchstart', (e) => { e.preventDefault(); onPress(); });
      element.addEventListener('touchend', (e) => { e.preventDefault(); onRelease(); });
    };

    bindControl(btnGas, () => { gasPressed = true; btnGas.classList.add('active'); }, () => { gasPressed = false; btnGas.classList.remove('active'); });
    bindControl(btnBrake, () => { brakePressed = true; btnBrake.classList.add('active'); }, () => { brakePressed = false; btnBrake.classList.remove('active'); });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === 'd') { gasPressed = true; btnGas.classList.add('active'); }
      if (e.key === 'ArrowLeft' || e.key === 'a') { brakePressed = true; btnBrake.classList.add('active'); }
    });

    window.addEventListener('keyup', (e) => {
      if (e.key === 'ArrowRight' || e.key === 'd') { gasPressed = false; btnGas.classList.remove('active'); }
      if (e.key === 'ArrowLeft' || e.key === 'a') { brakePressed = false; btnBrake.classList.remove('active'); }
    });

    window.addEventListener('resize', () => {
      render.canvas.width = window.innerWidth;
      render.canvas.height = window.innerHeight;
    });
  </script>
</body>
</html>
