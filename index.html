<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BẮN CHIM - 40 Màn Siêu Khó</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #111;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, Helvetica, sans-serif;
        }
        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 1400px;
            max-height: 750px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            color: white;
            text-align: center;
            padding: 20px;
            backdrop-filter: blur(5px);
        }
        
        #mainMenuScreen {
            background: linear-gradient(135deg, #1b4332, #2d6a4f, #40916c);
        }

        .logo-img {
            width: 110px;
            height: 110px;
            object-fit: cover;
            border-radius: 50%;
            border: 3px solid #ffcc00;
            box-shadow: 0 5px 15px rgba(0,0,0,0.6);
            margin-bottom: 12px;
        }

        .overlay h1 {
            font-size: 54px;
            margin: 0 0 25px 0;
            color: #ffcc00;
            text-shadow: 3px 3px 0px #ff3333;
            letter-spacing: 2px;
        }
        .btn {
            padding: 16px 50px;
            font-size: 20px;
            font-weight: bold;
            background: linear-gradient(to bottom, #8ddb44, #558822);
            color: #fff;
            border: 2px solid #335511;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 6px 0 #335511, 0 10px 20px rgba(0,0,0,0.4);
            transition: 0.1s;
            margin: 8px;
            min-width: 240px;
        }
        .btn:hover {
            background: linear-gradient(to bottom, #9ee85c, #669922);
        }
        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #335511, 0 5px 10px rgba(0,0,0,0.4);
        }
        .btn.locked {
            background: linear-gradient(to bottom, #777, #444);
            border-color: #222;
            box-shadow: 0 6px 0 #222;
            cursor: not-allowed;
            opacity: 0.6;
        }
        .hidden {
            display: none !important;
        }

        #gearBtn {
            position: absolute;
            top: 25px;
            right: 25px;
            z-index: 300;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid rgba(255, 255, 255, 0.7);
            color: #fff;
            width: 50px;
            height: 50px;
            font-size: 24px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(4px);
            transition: 0.2s;
        }
        #gearBtn:hover {
            background: rgba(0, 0, 0, 0.9);
            border-color: #ffcc00;
            transform: rotate(45deg);
        }

        .back-menu-btn {
            padding: 12px 35px;
            font-size: 16px;
            background: linear-gradient(to bottom, #ff8844, #cc4400);
            border: 2px solid #992200;
            box-shadow: 0 4px 0 #992200;
            border-radius: 20px;
            color: white;
            cursor: pointer;
            font-weight: bold;
            margin-top: 15px;
        }
        .back-menu-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #992200;
        }

        #levelGridContainer {
            max-height: 420px;
            overflow-y: auto;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            max-width: 750px;
            padding: 10px;
            margin-bottom: 20px;
        }

        #birdListScreen {
            background: linear-gradient(rgba(10, 30, 15, 0.92), rgba(5, 15, 8, 0.95)), 
                        radial-gradient(circle, #2d6a4f 0%, #1b4332 100%);
            overflow-y: auto;
            animation: slideDownTree 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes slideDownTree {
            0% { transform: translateY(-100%); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        #birdGridContainer {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
            max-width: 780px;
            margin: 10px auto;
            padding: 10px;
            max-height: 440px;
            overflow-y: auto;
        }

        .bird-card {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid #52b788;
            border-radius: 15px;
            padding: 12px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 6px 15px rgba(0,0,0,0.5);
            transition: 0.2s;
        }
        .bird-card:hover {
            transform: translateY(-4px);
            border-color: #ffcc00;
        }
        .bird-card.locked-card {
            background: rgba(0, 0, 0, 0.6);
            border-color: #444;
        }

        .bird-avatar-box {
            position: relative;
            width: 65px;
            height: 65px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 6px;
        }
        .bird-avatar-box img {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 50%;
            border: 2px solid #ffcc00;
        }
        .bird-avatar-box.dimmed img {
            filter: brightness(0.2) grayscale(1);
        }
        .lock-overlay-emoji {
            position: absolute;
            font-size: 24px;
            z-index: 2;
            text-shadow: 0 2px 5px rgba(0,0,0,0.9);
        }
        .mystery-bird-box {
            width: 60px;
            height: 60px;
            background: #1a1a1a;
            border: 2px dashed #666;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            color: #888;
            font-weight: bold;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        .bird-name {
            font-size: 13px;
            font-weight: bold;
            color: #ffcc00;
            margin-bottom: 6px;
            text-align: center;
        }

        .equip-btn {
            padding: 6px 10px;
            font-size: 11px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            border: none;
            width: 100%;
            transition: 0.1s;
        }
        .equip-btn.equipped {
            background: #2dc653;
            color: white;
            box-shadow: 0 3px 0 #1b7a33;
        }
        .equip-btn.equip-ready {
            background: #ffb703;
            color: #000;
            box-shadow: 0 3px 0 #b38200;
        }
        .equip-btn.equip-ready:hover {
            background: #ffca3a;
        }
        .equip-btn.locked-btn {
            background: #6c757d;
            color: #ccc;
            box-shadow: 0 3px 0 #495057;
            cursor: not-allowed;
        }

        #equipmentStatusBanner {
            background: rgba(0, 0, 0, 0.6);
            border: 2px dashed #ffcc00;
            padding: 8px 16px;
            border-radius: 20px;
            color: #ffcc00;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 5px;
            display: inline-block;
        }

        #achievementToast {
            position: absolute;
            bottom: 30px;
            right: -350px;
            width: 320px;
            background: linear-gradient(135deg, rgba(20, 20, 20, 0.95), rgba(40, 40, 40, 0.95));
            border: 2px solid #ffcc00;
            border-left: 6px solid #ffcc00;
            border-radius: 10px;
            padding: 14px 18px;
            color: white;
            z-index: 500;
            box-shadow: 0 8px 25px rgba(0,0,0,0.7);
            transition: right 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            font-family: Arial, sans-serif;
            text-align: left;
        }
        #achievementToast.show {
            right: 30px;
        }
        #achievementToast h4 {
            margin: 0 0 5px 0;
            color: #ffcc00;
            font-size: 15px;
        }
        #achievementToast p {
            margin: 0;
            font-size: 13px;
            line-height: 1.4;
            color: #e0e0e0;
        }

        #settingsModal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 400;
            backdrop-filter: blur(6px);
        }
        .settings-content {
            background: #222;
            border: 3px solid #558822;
            padding: 30px;
            border-radius: 20px;
            width: 380px;
            text-align: center;
            color: white;
            box-shadow: 0 10px 25px rgba(0,0,0,0.9);
        }
        .settings-content h2 {
            margin-top: 0;
            color: #ffcc00;
            font-size: 22px;
        }
        .setting-group {
            margin: 18px 0;
            text-align: left;
        }
        .setting-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            font-size: 14px;
        }
        .setting-group select, .setting-group input[type="range"] {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: none;
            background: #333;
            color: white;
            font-size: 15px;
        }
        .close-btn {
            background: #ff3333;
            color: white;
            border: none;
            padding: 10px 25px;
            font-size: 15px;
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 8px;
        }
        .close-btn:hover { background: #ff1a1a; }
    </style>
</head>
<body>

    <div id="gameContainer">
        <button id="gearBtn" onclick="openSettings()">⚙️</button>

        <div id="achievementToast">
            <h4 id="toastTitle">🏆 Mở khóa thành tựu</h4>
            <p id="toastDesc">Nội dung thông báo...</p>
        </div>

        <!-- Menu Chính -->
        <div id="mainMenuScreen" class="overlay">
            <img src="bird.jpg" alt="Bird Logo" class="logo-img" onerror="this.style.display='none'">
            <h1>BẮN CHIM</h1>
            <div style="display: flex; flex-direction: column; gap: 12px; align-items: center;">
                <button class="btn" onclick="startLevel(maxLevelUnlocked)">PLAY</button>
                <button class="btn" onclick="openLevelMenu()" style="background: linear-gradient(to bottom, #3388ff, #1155cc); border-color: #113399; box-shadow: 0 6px 0 #113399;">CHỌN MÀN</button>
                <button class="btn" onclick="openBirdListMenu()" style="background: linear-gradient(to bottom, #9d4edd, #5a189a); border-color: #3c096c; box-shadow: 0 6px 0 #3c096c;">DANH SÁCH CHIM</button>
            </div>
        </div>

        <div id="birdListScreen" class="overlay hidden">
            <h1>🌳 DANH SÁCH CHIM 🌳</h1>
            <div id="equipmentStatusBanner">Đã trang bị: 1/2 con</div>
            <p style="margin: 0 0 8px 0; color: #b7e4c7; font-size: 13px;">Chọn tối đa 2 chú chim để phối hợp ra trận (chia đều lượt bắn)!</p>
            <div id="birdGridContainer"></div>
            <button class="back-menu-btn" onclick="returnToMainMenu()">Về Menu Chính</button>
        </div>

        <div id="levelMenuScreen" class="overlay hidden">
            <h1>CHỌN MÀN CHƠI (1 - 40)</h1>
            <div id="levelGridContainer"></div>
            <button class="back-menu-btn" onclick="returnToMainMenu()">Về Menu Chính</button>
        </div>

        <div id="settingsModal" class="hidden">
            <div class="settings-content">
                <h2>CÀI ĐẶT ÂM THANH</h2>
                
                <div class="setting-group">
                    <label>Chọn Nhạc Nền:</label>
                    <select id="bgMusicSelect" onchange="changeBackgroundMusic()">
                        <option value="angrybird.sound2.mp4" selected>Nhạc 2 (angrybird.sound2.mp4)</option>
                        <option value="angrybird.sound.mp4">Nhạc 1 (angrybird.sound.mp4)</option>
                    </select>
                </div>

                <div class="setting-group">
                    <label>Âm lượng: <span id="volumeValue">50</span>%</label>
                    <input type="range" id="volumeSlider" min="0" max="100" value="50" oninput="updateVolume(this.value)">
                </div>

                <div class="setting-group" style="display: flex; gap: 10px;">
                    <button class="btn" style="flex:1; padding: 10px; font-size: 15px; margin:0;" onclick="toggleMute()" id="muteBtn">Tắt Nhạc</button>
                </div>

                <button class="btn" style="width: 100%; padding: 10px; font-size: 15px; background: linear-gradient(to bottom, #ff8844, #cc4400); border-color: #992200; box-shadow: 0 4px 0 #992200; margin: 5px 0 12px 0;" onclick="closeSettings(); returnToMainMenu();">Về Menu Chính</button>

                <button class="close-btn" onclick="closeSettings()">Đóng</button>
            </div>
        </div>

        <div id="gameOverScreen" class="overlay hidden">
            <h1 id="gameOverTitle">CHIẾN THẮNG!</h1>
            <p id="finalScoreText" style="font-size: 18px;">Tổng điểm tuyệt đối: 0</p>
            <div style="display: flex; flex-direction: column; gap: 10px; align-items: center;">
                <div style="display: flex; gap: 12px;">
                    <button class="btn" style="min-width: 150px; padding: 12px 20px; font-size: 16px;" onclick="startLevel(currentLevel)">CHƠI LẠI</button>
                    <button class="btn" style="background: #3388ff; border-color: #1155cc; box-shadow: 0 5px 0 #1155cc; min-width: 150px; padding: 12px 20px; font-size: 16px;" onclick="openLevelMenu()">CHỌN MÀN</button>
                </div>
                <button class="back-menu-btn" style="margin-top: 5px;" onclick="returnToMainMenu()">Về Menu Chính</button>
            </div>
        </div>

        <canvas id="gameCanvas"></canvas>
    </div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

ctx.imageSmoothingEnabled = true;
ctx.imageSmoothingQuality = 'high';

const mainMenuScreen = document.getElementById("mainMenuScreen");
const levelMenuScreen = document.getElementById("levelMenuScreen");
const birdListScreen = document.getElementById("birdListScreen");
const gameOverScreen = document.getElementById("gameOverScreen");
const gameOverTitle = document.getElementById("gameOverTitle");
const finalScoreText = document.getElementById("finalScoreText");
const settingsModal = document.getElementById("settingsModal");
const volumeSlider = document.getElementById("volumeSlider");
const volumeValue = document.getElementById("volumeValue");
const muteBtn = document.getElementById("muteBtn");
const bgMusicSelect = document.getElementById("bgMusicSelect");
const levelGridContainer = document.getElementById("levelGridContainer");
const birdGridContainer = document.getElementById("birdGridContainer");
const equipmentStatusBanner = document.getElementById("equipmentStatusBanner");
const achievementToast = document.getElementById("achievementToast");
const toastTitle = document.getElementById("toastTitle");
const toastDesc = document.getElementById("toastDesc");

let maxLevelUnlocked = parseInt(localStorage.getItem("banChimMaxLevel40")) || 1;
let equippedBirds = JSON.parse(localStorage.getItem("banChimEquippedBirds")) || ["red"];
let toastTimeout = null;

const allBirdsConfig = [
    { id: "red", name: "Chim Đỏ", unlockLevel: 1, type: "bird", imageFile: "red bird.jpg" },
    { id: "yellow", name: "Chim Vàng", unlockLevel: 10, type: "bird", imageFile: "yellow bird.jpg" },
    { id: "blue", name: "Chim Xanh", unlockLevel: 20, type: "bird", imageFile: "blue bird.jpg" },
    { id: "black", name: "Chim Đen", unlockLevel: 30, type: "bird", imageFile: "nagi bird.jpg" },
    { id: "coming1", name: "Coming Soon", unlockLevel: 35, type: "coming" },
    { id: "coming2", name: "Coming Soon", unlockLevel: 38, type: "coming" },
    { id: "coming3", name: "Coming Soon", unlockLevel: 40, type: "coming" },
    { id: "coming4", name: "Coming Soon", unlockLevel: 45, type: "coming" }
];

function showAchievementToast(title, desc) {
    toastTitle.textContent = title;
    toastDesc.textContent = desc;
    achievementToast.classList.add("show");
    
    if (toastTimeout) clearTimeout(toastTimeout);
    toastTimeout = setTimeout(() => {
        achievementToast.classList.remove("show");
    }, 4500);
}

function buildLevelGrid() {
    levelGridContainer.innerHTML = "";
    for (let i = 1; i <= 40; i++) {
        let btn = document.createElement("button");
        btn.className = "btn";
        btn.style.cssText = "padding: 12px 18px; min-width: 75px; font-size: 15px; margin: 4px;";
        if (i <= maxLevelUnlocked) {
            btn.textContent = `${i}`;
            btn.onclick = () => startLevel(i);
        } else {
            btn.className = "btn locked";
            btn.textContent = `${i} 🔒`;
        }
        levelGridContainer.appendChild(btn);
    }
}
buildLevelGrid();

function buildBirdGrid() {
    birdGridContainer.innerHTML = "";
    equipmentStatusBanner.textContent = `Đã trang bị: ${equippedBirds.length}/2 con`;

    allBirdsConfig.forEach(bInfo => {
        let isUnlocked = maxLevelUnlocked >= bInfo.unlockLevel;
        let isEquipped = equippedBirds.includes(bInfo.id);

        let card = document.createElement("div");
        card.className = `bird-card ${isUnlocked ? '' : 'locked-card'}`;

        let avatarBox = document.createElement("div");
        avatarBox.className = `bird-avatar-box ${isUnlocked ? '' : 'dimmed'}`;

        if (bInfo.type === "coming") {
            let mysteryDiv = document.createElement("div");
            mysteryDiv.className = "mystery-bird-box";
            mysteryDiv.textContent = "?";
            avatarBox.innerHTML = "";
            avatarBox.appendChild(mysteryDiv);
        } else {
            let imgElem = document.createElement("img");
            imgElem.src = bInfo.imageFile;
            imgElem.alt = bInfo.name;
            imgElem.onerror = () => {
                imgElem.style.display = 'none';
            };
            avatarBox.appendChild(imgElem);
        }

        if (!isUnlocked) {
            let lockEmoji = document.createElement("span");
            lockEmoji.className = "lock-overlay-emoji";
            lockEmoji.textContent = "🔒";
            avatarBox.appendChild(lockEmoji);
        }

        let nameDiv = document.createElement("div");
        nameDiv.className = "bird-name";
        nameDiv.textContent = bInfo.name;

        let btnElem = document.createElement("button");
        if (bInfo.type === "coming") {
            btnElem.className = "equip-btn locked-btn";
            btnElem.textContent = "Sắp ra mắt";
        } else if (!isUnlocked) {
            btnElem.className = "equip-btn locked-btn";
            btnElem.textContent = `Cần màn ${bInfo.unlockLevel}`;
        } else if (isEquipped) {
            btnElem.className = "equip-btn equipped";
            btnElem.textContent = "Đã trang bị";
            btnElem.onclick = () => {
                if (equippedBirds.length > 1) {
                    equippedBirds = equippedBirds.filter(id => id !== bInfo.id);
                    localStorage.setItem("banChimEquippedBirds", JSON.stringify(equippedBirds));
                    buildBirdGrid();
                } else {
                    alert("Cần trang bị ít nhất 1 chú chim ra trận!");
                }
            };
        } else {
            btnElem.className = "equip-btn equip-ready";
            btnElem.textContent = "Trang bị";
            btnElem.onclick = () => {
                if (equippedBirds.length < 2) {
                    equippedBirds.push(bInfo.id);
                } else {
                    equippedBirds.shift();
                    equippedBirds.push(bInfo.id);
                }
                localStorage.setItem("banChimEquippedBirds", JSON.stringify(equippedBirds));
                buildBirdGrid();
            };
        }

        card.appendChild(avatarBox);
        card.appendChild(nameDiv);
        card.appendChild(btnElem);
        birdGridContainer.appendChild(card);
    });
}

function openBirdListMenu() {
    mainMenuScreen.classList.add("hidden");
    birdListScreen.classList.remove("hidden");
    buildBirdGrid();
}

function openLevelMenu() {
    mainMenuScreen.classList.add("hidden");
    gameOverScreen.classList.add("hidden");
    birdListScreen.classList.add("hidden");
    levelMenuScreen.classList.remove("hidden");
    buildLevelGrid();
}

function returnToMainMenu() {
    levelMenuScreen.classList.add("hidden");
    birdListScreen.classList.add("hidden");
    gameOverScreen.classList.add("hidden");
    mainMenuScreen.classList.remove("hidden");
    gameState = "MENU";
    if (!isMuted) {
        bgMusic.play().catch(e => console.log(e));
    }
}

let currentMusicFile = "angrybird.sound2.mp4";
let bgMusic = new Audio(currentMusicFile);
bgMusic.loop = true;
bgMusic.volume = 0.5;

// Âm thanh khi Thắng
const victorySound = new Audio("victorysound.mp4");
victorySound.volume = 0.7;

// Âm thanh khi Thua
const defeatSound = new Audio("defeatsound.mp4");
defeatSound.volume = 0.7;

let isMuted = false;

function openSettings() { settingsModal.classList.remove("hidden"); }
function closeSettings() { settingsModal.classList.add("hidden"); }

function changeBackgroundMusic() {
    let selectedFile = bgMusicSelect.value;
    bgMusic.pause();
    currentMusicFile = selectedFile;
    bgMusic = new Audio(currentMusicFile);
    bgMusic.loop = true;
    bgMusic.volume = volumeSlider.value / 100;
    if (!isMuted) {
        bgMusic.play().catch(e => console.log(e));
    }
}

function updateVolume(val) {
    volumeValue.textContent = val;
    let vol = val / 100;
    bgMusic.volume = vol;
    victorySound.volume = vol;
    defeatSound.volume = vol;
    if (val > 0 && isMuted) {
        isMuted = false;
        muteBtn.textContent = "Tắt Nhạc";
        muteBtn.style.background = "linear-gradient(to bottom, #8ddb44, #558822)";
    }
}

function toggleMute() {
    isMuted = !isMuted;
    if (isMuted) {
        bgMusic.pause();
        victorySound.pause();
        defeatSound.pause();
        muteBtn.textContent = "Bật Nhạc";
        muteBtn.style.background = "#ff3333";
    } else {
        muteBtn.textContent = "Tắt Nhạc";
        muteBtn.style.background = "linear-gradient(to bottom, #8ddb44, #558822)";
        bgMusic.play().catch(e => console.log(e));
    }
}

let gameState = "MENU"; 
let currentLevel = 1;
let score = 0;
let lives = 4;
let groundY = 0;
let scale = 1;

let sling = { x: 0, y: 0 };
let birdTypes = ["red", "red", "red", "red"];
let currentBirdIndex = 0;

let bird = { 
    x: 0, y: 0, radius: 22, vx: 0, vy: 0, 
    isDragging: false, isLaunched: false, 
    type: "red", skillUsed: false 
};

let subBirds = [];
let explosions = [];

let targets = [];
let trapezoidPlatforms = [];
let particles = [];
let screenShakeTime = 0;

function triggerScreenShake(duration) {
    screenShakeTime = duration;
}

function createDebris(x, y, color) {
    for (let i = 0; i < 8; i++) {
        particles.push({
            x: x, y: y,
            vx: (Math.random() - 0.5) * 10 * scale,
            vy: (Math.random() - 0.8) * 10 * scale,
            radius: (Math.random() * 5 + 2) * scale,
            color: color, alpha: 1.0
        });
    }
}

function resizeCanvas() {
    canvas.width = canvas.parentElement.clientWidth;
    canvas.height = canvas.parentElement.clientHeight;

    let scaleX = canvas.width / 1400;
    let scaleY = canvas.height / 650;
    scale = Math.min(scaleX, scaleY);
    if (scale < 0.6) scale = 0.6;

    groundY = canvas.height - 200 * scale;
    sling.x = canvas.width * 0.15;
    sling.y = groundY - 90 * scale;

    if (!bird.isLaunched && !bird.isDragging) {
        bird.x = sling.x;
        bird.y = sling.y;
    }

    bird.radius = 22 * scale;
}

function loadLevel(lvl) {
    currentLevel = lvl;
    resizeCanvas();
    currentBirdIndex = 0;
    particles = [];
    subBirds = [];
    explosions = [];
    
    birdTypes = [];
    let activeList = equippedBirds;
    for (let i = 0; i < 4; i++) {
        let chosenBird = activeList[i % activeList.length];
        birdTypes.push(chosenBird);
    }
    bird.type = birdTypes[0];

    targets = [];
    trapezoidPlatforms = [];

    // Tăng số lượng bệ đỡ nhiều hơn để có nhiều chỗ xây block
    let platformCount = 2 + (lvl % 3);
    let startX = canvas.width * 0.44;
    
    for (let p = 0; p < platformCount; p++) {
        let pWidth = (160 + (lvl * 6) % 70) * scale;
        let pHeight = (45 + (lvl * 4) % 30) * scale;
        let px = startX + (p * 240 * scale);
        let py = groundY - pHeight;
        
        trapezoidPlatforms.push({
            x: px, y: py, width: pWidth, height: pHeight,
            topWidth: pWidth * 0.65
        });
    }

    let blockW = 38 * scale;
    let blockH = 58 * scale;
    // Đảm bảo số lượng heo luôn ít nhất là 5 con và tăng dần theo màn
    let pigCount = Math.max(5, Math.min(5 + Math.floor(lvl / 3), 12));

    // Thêm nhiều block xây dựng phong phú hơn trên mỗi bệ
    trapezoidPlatforms.forEach((plat, idx) => {
        let tType1 = (idx % 2 === 0) ? "stone" : "wood";
        let tType2 = (idx % 3 === 0) ? "ice" : "stone";

        // Cột đứng tầng 1
        targets.push({ type: tType1, x: plat.x + plat.width * 0.1, y: plat.y - blockH, width: blockW, height: blockH, alive: true });
        targets.push({ type: tType1, x: plat.x + plat.width * 0.45, y: plat.y - blockH, width: blockW, height: blockH, alive: true });
        targets.push({ type: tType1, x: plat.x + plat.width * 0.78, y: plat.y - blockH, width: blockW, height: blockH, alive: true });

        // Tấm chắn ngang tầng 1
        targets.push({ type: tType2, x: plat.x, y: plat.y - blockH - 18 * scale, width: plat.width, height: 18 * scale, alive: true });

        // Cột đứng tầng 2 (nhiều block hơn)
        targets.push({ type: "wood", x: plat.x + plat.width * 0.22, y: plat.y - (blockH * 2) - 18 * scale, width: blockW, height: blockH, alive: true });
        targets.push({ type: tType2, x: plat.x + plat.width * 0.55, y: plat.y - (blockH * 2) - 18 * scale, width: blockW, height: blockH, alive: true });

        // Tấm mái che tầng 2
        targets.push({ type: "stone", x: plat.x + plat.width * 0.15, y: plat.y - (blockH * 2) - 36 * scale, width: plat.width * 0.7, height: 16 * scale, alive: true });
    });

    // Phân bổ ít nhất 5+ con heo khắp các tầng tháp block
    for (let p = 0; p < pigCount; p++) {
        let platIndex = p % trapezoidPlatforms.length;
        let plat = trapezoidPlatforms[platIndex];
        
        let px = plat.x + plat.width * 0.3 + (p * 18) % (plat.width * 0.5);
        let py = plat.y - 25 * scale;
        if (p >= 4) py = plat.y - blockH - 30 * scale;
        if (p >= 8) py = plat.y - (blockH * 2) - 50 * scale;

        targets.push({
            type: "pig",
            x: px, y: py,
            alive: true,
            radius: (18 + (p % 3)) * scale,
            vy: 0
        });
    }
}

function startLevel(lvl) {
    if (lvl > maxLevelUnlocked) {
        alert("Bạn cần phải vượt qua màn trước để mở khóa màn này!");
        return;
    }
    gameState = "PLAYING";
    score = 0;
    lives = 4;
    mainMenuScreen.classList.add("hidden");
    levelMenuScreen.classList.add("hidden");
    birdListScreen.classList.add("hidden");
    gameOverScreen.classList.add("hidden");
    loadLevel(lvl);
    resetBird();

    victorySound.pause();
    victorySound.currentTime = 0;
    defeatSound.pause();
    defeatSound.currentTime = 0;

    if (!isMuted) {
        bgMusic.play().catch(e => console.log(e));
    }
}

function endGame(isWin) {
    gameState = "GAMEOVER";
    gameOverScreen.classList.remove("hidden");
    bgMusic.pause();

    if (isWin) {
        let bonusScore = lives * 100;
        score += bonusScore;

        gameOverTitle.textContent = "CHIẾN THẮNG MÀN " + currentLevel + "!";
        gameOverTitle.style.color = "#8ddb44";
        finalScoreText.innerHTML = `Tổng điểm đạt được: ${score} <br><span style="font-size:15px; color:#ffcc00;">(+${bonusScore} điểm thưởng chim dư)</span>`;

        if (currentLevel === 10) {
            showAchievementToast("🎉 Mở khóa thành tựu!", "Đã mở khóa: CHIM VÀNG (Bứt tốc siêu cấp)");
        } else if (currentLevel === 20) {
            showAchievementToast("🎉 Mở khóa thành tựu!", "Đã mở khóa: CHIM XANH (Tách 3 con nhỏ)");
        } else if (currentLevel === 30) {
            showAchievementToast("🎉 Mở khóa thành tựu!", "Đã mở khóa: CHIM ĐEN (Bom nổ hủy diệt)");
        }

        if (currentLevel >= maxLevelUnlocked && currentLevel < 40) {
            maxLevelUnlocked = currentLevel + 1;
            localStorage.setItem("banChimMaxLevel40", maxLevelUnlocked);
        }

        if (!isMuted) {
            victorySound.currentTime = 0;
            victorySound.play().catch(e => console.log(e));
        }
    } else {
        gameOverTitle.textContent = "THẤT BẠI - HẾT LƯỢT BẮN!";
        gameOverTitle.style.color = "#ff3333";
        finalScoreText.innerHTML = "Điểm số đạt được: " + score;

        if (!isMuted) {
            defeatSound.currentTime = 0;
            defeatSound.play().catch(e => console.log(e));
        }
    }
}

function resetBird() {
    bird.x = sling.x;
    bird.y = sling.y;
    bird.vx = 0;
    bird.vy = 0;
    bird.isLaunched = false;
    bird.isDragging = false;
    bird.skillUsed = false;
    subBirds = [];
    if (currentBirdIndex < birdTypes.length) {
        bird.type = birdTypes[currentBirdIndex];
    }
}

function getPointerPos(e) {
    const rect = canvas.getBoundingClientRect();
    let clientX = e.clientX;
    let clientY = e.clientY;
    if (e.touches && e.touches.length > 0) {
        clientX = e.touches[0].clientX;
        clientY = e.touches[0].clientY;
    }
    return { x: clientX - rect.left, y: clientY - rect.top };
}

function triggerSkill() {
    if (gameState === "PLAYING" && bird.isLaunched && !bird.skillUsed) {
        bird.skillUsed = true;
        
        if (bird.type === "yellow") {
            bird.vx *= 2.3;
            bird.vy *= 1.2;
        } else if (bird.type === "blue") {
            let baseAngle = Math.atan2(bird.vy, bird.vx);
            let baseSpeed = Math.hypot(bird.vx, bird.vy);
            
            subBirds.push({
                x: bird.x, y: bird.y, radius: bird.radius * 0.65,
                vx: Math.cos(baseAngle - 0.25) * baseSpeed * 1.1,
                vy: Math.sin(baseAngle - 0.25) * baseSpeed * 1.1,
                type: "blue"
            });
            subBirds.push({
                x: bird.x, y: bird.y, radius: bird.radius * 0.65,
                vx: Math.cos(baseAngle) * baseSpeed * 1.15,
                vy: Math.sin(baseAngle) * baseSpeed * 1.15,
                type: "blue"
            });
            subBirds.push({
                x: bird.x, y: bird.y, radius: bird.radius * 0.65,
                vx: Math.cos(baseAngle + 0.25) * baseSpeed * 1.1,
                vy: Math.sin(baseAngle + 0.25) * baseSpeed * 1.1,
                type: "blue"
            });
            
            bird.x = -9999;
            bird.y = -9999;
            bird.vx = 0;
            bird.vy = 0;
        } else if (bird.type === "black") {
            explodeBlackBird(bird.x, bird.y);
        } else {
            bird.vx *= 1.35;
        }
    }
}

function explodeBlackBird(x, y) {
    triggerScreenShake(20);
    explosions.push({ x: x, y: y, radius: 10, maxRadius: 115 * scale, alpha: 1.0 });
    
    targets.forEach(t => {
        if (!t.alive) return;
        let tx = t.type === "pig" ? t.x : t.x + t.width/2;
        let ty = t.type === "pig" ? t.y : t.y + t.height/2;
        if (Math.hypot(x - tx, y - ty) < 130 * scale) {
            t.alive = false;
            score += (t.type === "pig" ? 500 : 250);
            createDebris(tx, ty, t.type === "pig" ? "#7acc29" : "#b5651d");
        }
    });

    bird.isLaunched = false;
    handleBirdFinish();
}

function onTouchStart(e) {
    if (gameState !== "PLAYING") return;
    if (bird.isLaunched) {
        triggerSkill();
        return;
    }
    if (lives <= 0) return;

    const pos = getPointerPos(e);
    if (Math.hypot(pos.x - bird.x, pos.y - bird.y) < bird.radius + 30) {
        bird.isDragging = true;
    }
}

function onTouchMove(e) {
    if (!bird.isDragging) return;
    const pos = getPointerPos(e);
    const dx = pos.x - sling.x;
    const dy = pos.y - sling.y;
    const dist = Math.hypot(dx, dy);
    const maxDrag = 140 * scale;

    let angle = Math.atan2(dy, dx);
    let currentDist = Math.min(dist, maxDrag);

    bird.x = sling.x + Math.cos(angle) * currentDist;
    bird.y = sling.y + Math.sin(angle) * currentDist;
}

function onTouchEnd() {
    if (!bird.isDragging) return;
    bird.isDragging = false;
    bird.isLaunched = true;

    // ĐÃ TẮT ÂM THANH KHI BẮN THEO YÊU CẦU

    bird.vx = (sling.x - bird.x) * 0.21;
    bird.vy = (sling.y - bird.y) * 0.21;
}

window.addEventListener("mousedown", onTouchStart);
window.addEventListener("mousemove", onTouchMove);
window.addEventListener("mouseup", onTouchEnd);

canvas.addEventListener("touchstart", onTouchStart, { passive: true });
canvas.addEventListener("touchmove", onTouchMove, { passive: true });
window.addEventListener("touchend", onTouchEnd);
window.addEventListener("resize", resizeCanvas);

function checkCollision(b, t) {
    if (!t.alive) return false;
    if (t.type === "pig") {
        return Math.hypot(b.x - t.x, b.y - t.y) < b.radius + t.radius;
    } else {
        let closestX = Math.max(t.x, Math.min(b.x, t.x + t.width));
        let closestY = Math.max(t.y, Math.min(b.y, t.y + t.height));
        return Math.hypot(b.x - closestX, b.y - closestY) < b.radius;
    }
}

function drawBirdByType(type, x, y, r) {
    ctx.save();
    ctx.translate(x, y);

    if (type === "yellow") {
        let grad = ctx.createRadialGradient(0, -r*0.2, r*0.1, 0, 0, r);
        grad.addColorStop(0, "#fff176"); grad.addColorStop(0.6, "#fbc02d"); grad.addColorStop(1, "#f57f17");
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.moveTo(0, -r*1.3);
        ctx.lineTo(r*1.2, r*0.9);
        ctx.lineTo(-r*1.2, r*0.9);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = "#000000"; ctx.lineWidth = 2.8 * scale; ctx.stroke();

        ctx.fillStyle = "#ff8f00";
        ctx.beginPath(); ctx.moveTo(r*0.8, r*0.1); ctx.lineTo(r*1.6, r*0.3); ctx.lineTo(r*0.8, r*0.6); ctx.closePath(); ctx.fill(); 
        ctx.strokeStyle = "#000000"; ctx.lineWidth = 1.5; ctx.stroke();
    } else if (type === "blue") {
        let grad = ctx.createRadialGradient(-r*0.3, -r*0.3, r*0.05, 0, 0, r);
        grad.addColorStop(0, "#4dd0e1"); grad.addColorStop(0.6, "#00acc1"); grad.addColorStop(1, "#006064");
        ctx.fillStyle = grad;
        ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = "#000000"; ctx.lineWidth = 2.8 * scale; ctx.stroke();

        drawDetailedEyesAndBeak(r, "#ffb74d", "#f57c00");
    } else if (type === "black") {
        let grad = ctx.createRadialGradient(-r*0.3, -r*0.3, r*0.05, 0, 0, r);
        grad.addColorStop(0, "#616161"); grad.addColorStop(0.6, "#212121"); grad.addColorStop(1, "#000000");
        ctx.fillStyle = grad;
        ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = "#000000"; ctx.lineWidth = 2.8 * scale; ctx.stroke();

        ctx.strokeStyle = "#ffcc00"; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(0, -r); ctx.quadraticCurveTo(r*0.6, -r*1.5, r*0.9, -r*1.4); ctx.stroke();
        ctx.fillStyle = "#ff3333"; ctx.beginPath(); ctx.arc(r*0.9, -r*1.4, 4 * scale, 0, Math.PI*2); ctx.fill();

        drawDetailedEyesAndBeak(r, "#ffb74d", "#f57c00");
    } else {
        let grad = ctx.createRadialGradient(-r*0.3, -r*0.3, r*0.05, 0, 0, r);
        grad.addColorStop(0, "#ff6b6b"); grad.addColorStop(0.6, "#e53935"); grad.addColorStop(1, "#b71c1c");
        ctx.fillStyle = grad;
        ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = "#000000"; ctx.lineWidth = 2.8 * scale; ctx.stroke();

        ctx.fillStyle = "#3a0000";
        ctx.beginPath(); ctx.moveTo(-r*0.85, -r*0.35); ctx.lineTo(r*0.7, -r*0.05); ctx.lineTo(r*0.6, r*0.15); ctx.lineTo(-r*0.75, -r*0.15); ctx.closePath(); ctx.fill();
        
        drawDetailedEyesAndBeak(r, "#ffb74d", "#f57c00");
    }
    ctx.restore();
}

function drawDetailedEyesAndBeak(r, beakColor1, beakColor2) {
    ctx.fillStyle = "#ffffff";
    ctx.beginPath();
    ctx.arc(-r*0.28, -r*0.05, r*0.32, 0, Math.PI * 2);
    ctx.arc(r*0.28, -r*0.05, r*0.32, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#000"; ctx.lineWidth = 1.8 * scale; ctx.stroke();

    ctx.fillStyle = "#000000";
    ctx.beginPath();
    ctx.arc(-r*0.16, -r*0.05, r*0.12, 0, Math.PI * 2);
    ctx.arc(r*0.4, -r*0.05, r*0.12, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = beakColor1;
    ctx.beginPath();
    ctx.moveTo(r*0.2, r*0.02);
    ctx.lineTo(r*0.88, r*0.15);
    ctx.lineTo(r*0.3, r*0.42);
    ctx.closePath();
    ctx.fill(); ctx.strokeStyle = "#000"; ctx.lineWidth = 1.2; ctx.stroke();

    ctx.fillStyle = beakColor2;
    ctx.beginPath();
    ctx.moveTo(r*0.2, r*0.38);
    ctx.lineTo(r*0.7, r*0.48);
    ctx.lineTo(r*0.3, r*0.65);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
}

function drawPig(x, y, r) {
    ctx.save();
    ctx.translate(x, y);

    ctx.strokeStyle = "#000000";
    ctx.lineWidth = 2.2 * scale;

    ctx.fillStyle = "#6fc525";
    ctx.beginPath(); ctx.arc(-r * 0.42, -r * 0.78, r * 0.3, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#6fc525";
    ctx.beginPath(); ctx.arc(r * 0.42, -r * 0.78, r * 0.3, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

    ctx.fillStyle = "#7acc29";
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

    let timeSec = Date.now() / 400;
    let isBlinking = (Math.sin(timeSec + x) > 0.85);
    let eyeRadius = r * 0.28;
    let eyeOffsetX = r * 0.46;

    ctx.fillStyle = "#ffffff";
    ctx.beginPath(); ctx.arc(-eyeOffsetX, -r * 0.15, eyeRadius, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    if (!isBlinking) {
        ctx.fillStyle = "#000000";
        ctx.beginPath(); ctx.arc(-eyeOffsetX + r * 0.05, -r * 0.15, r * 0.08, 0, Math.PI * 2); ctx.fill();
    }

    ctx.fillStyle = "#ffffff";
    ctx.beginPath(); ctx.arc(eyeOffsetX, -r * 0.15, eyeRadius, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    if (!isBlinking) {
        ctx.fillStyle = "#000000";
        ctx.beginPath(); ctx.arc(eyeOffsetX - r * 0.05, -r * 0.15, r * 0.08, 0, Math.PI * 2); ctx.fill();
    }

    ctx.fillStyle = "#8fe038";
    ctx.beginPath(); ctx.ellipse(0, r * 0.18, r * 0.45, r * 0.35, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#2d570c";
    ctx.beginPath(); ctx.arc(-r * 0.13, r * 0.16, r * 0.07, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(r * 0.13, r * 0.16, r * 0.07, 0, Math.PI * 2); ctx.fill();

    ctx.restore();
}

function drawCanvasBackground() {
    let skyGrad = ctx.createLinearGradient(0, 0, 0, groundY);
    skyGrad.addColorStop(0, "#3a98c9");
    skyGrad.addColorStop(1, "#b4f0f8");
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "rgba(255, 255, 255, 0.75)";
    drawCloud(canvas.width * 0.2, canvas.height * 0.12, 90 * scale);
    drawCloud(canvas.width * 0.65, canvas.height * 0.2, 120 * scale);

    ctx.fillStyle = "#65b830";
    ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);

    ctx.strokeStyle = "#387515";
    ctx.lineWidth = 4 * scale;
    ctx.beginPath();
    ctx.moveTo(0, groundY);
    ctx.lineTo(canvas.width, groundY);
    ctx.stroke();
}

function drawCloud(x, y, size) {
    ctx.beginPath();
    ctx.arc(x, y, size * 0.4, 0, Math.PI * 2);
    ctx.arc(x + size * 0.35, y - size * 0.15, size * 0.35, 0, Math.PI * 2);
    ctx.arc(x + size * 0.7, y, size * 0.3, 0, Math.PI * 2);
    ctx.fill();
}

function handleBirdFinish() {
    lives--;
    currentBirdIndex++;
    let remainingPigs = targets.some(t => t.type === "pig" && t.alive);
    if (!remainingPigs) {
        endGame(true);
    } else if (lives <= 0 || currentBirdIndex >= birdTypes.length) {
        setTimeout(() => {
            let checkPigs = targets.some(t => t.type === "pig" && t.alive);
            if (!checkPigs) endGame(true);
            else endGame(false);
        }, 500);
    } else {
        resetBird();
    }
}

function update() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.save();
    if (screenShakeTime > 0) {
        let offsetX = (Math.random() - 0.5) * 12;
        let offsetY = (Math.random() - 0.5) * 12;
        ctx.translate(offsetX, offsetY);
        screenShakeTime--;
    }

    drawCanvasBackground();

    trapezoidPlatforms.forEach(plat => {
        ctx.fillStyle = "#8a5a36";
        ctx.beginPath();
        ctx.moveTo(plat.x, groundY);
        ctx.lineTo(plat.x + plat.width, groundY);
        ctx.lineTo(plat.x + plat.width * 0.82, plat.y);
        ctx.lineTo(plat.x + plat.width * 0.18, plat.y);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = "#5c3a21";
        ctx.lineWidth = 3 * scale;
        ctx.stroke();

        ctx.fillStyle = "#559c25";
        ctx.fillRect(plat.x + plat.width * 0.18, plat.y, plat.width * 0.64, 12 * scale);
    });

    // Vẽ cây ná sinh động, đẹp và chi tiết hơn giống game gốc
    ctx.save();
    let slingBaseGrad = ctx.createLinearGradient(sling.x - 14*scale, 0, sling.x + 14*scale, 0);
    slingBaseGrad.addColorStop(0, "#5c3a21");
    slingBaseGrad.addColorStop(0.5, "#8a5a36");
    slingBaseGrad.addColorStop(1, "#452814");
    
    ctx.fillStyle = slingBaseGrad;
    ctx.strokeStyle = "#2b1604";
    ctx.lineWidth = 3 * scale;

    ctx.beginPath();
    ctx.moveTo(sling.x - 14 * scale, groundY);
    ctx.lineTo(sling.x - 7 * scale, sling.y + 15 * scale);
    ctx.lineTo(sling.x + 7 * scale, sling.y + 15 * scale);
    ctx.lineTo(sling.x + 14 * scale, groundY);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(sling.x - 8 * scale, sling.y + 20 * scale);
    ctx.quadraticCurveTo(sling.x - 24 * scale, sling.y - 10 * scale, sling.x - 22 * scale, sling.y - 25 * scale);
    ctx.lineTo(sling.x - 14 * scale, sling.y - 25 * scale);
    ctx.quadraticCurveTo(sling.x - 16 * scale, sling.y - 5 * scale, sling.x - 4 * scale, sling.y + 15 * scale);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(sling.x + 8 * scale, sling.y + 20 * scale);
    ctx.quadraticCurveTo(sling.x + 24 * scale, sling.y - 10 * scale, sling.x + 22 * scale, sling.y - 25 * scale);
    ctx.lineTo(sling.x + 14 * scale, sling.y - 25 * scale);
    ctx.quadraticCurveTo(sling.x + 16 * scale, sling.y - 5 * scale, sling.x + 4 * scale, sling.y + 15 * scale);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = "#38200f";
    ctx.beginPath();
    ctx.arc(sling.x - 18 * scale, sling.y - 23 * scale, 4.5 * scale, 0, Math.PI * 2);
    ctx.arc(sling.x + 18 * scale, sling.y - 23 * scale, 4.5 * scale, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.restore();

    if (bird.isDragging) {
        ctx.strokeStyle = "#4d2c12";
        ctx.lineWidth = 5 * scale;
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(sling.x - 18 * scale, sling.y - 23 * scale);
        ctx.lineTo(bird.x, bird.y);
        ctx.moveTo(sling.x + 18 * scale, sling.y - 23 * scale);
        ctx.lineTo(bird.x, bird.y);
        ctx.stroke();

        let simVx = (sling.x - bird.x) * 0.21;
        let simVy = (sling.y - bird.y) * 0.21;
        let simX = bird.x;
        let simY = bird.y;

        ctx.fillStyle = "rgba(255, 255, 255, 0.6)";
        for (let i = 0; i < 10; i++) {
            simVy += 0.35 * scale;
            simX += simVx;
            simY += simVy;
            ctx.beginPath();
            ctx.arc(simX, simY, (3.5 - i * 0.15) * scale, 0, Math.PI * 2);
            ctx.fill();
            if (simY > groundY) break;
        }
    } else {
        ctx.strokeStyle = "#4d2c12";
        ctx.lineWidth = 4 * scale;
        ctx.beginPath();
        ctx.moveTo(sling.x - 18 * scale, sling.y - 23 * scale);
        ctx.lineTo(sling.x, sling.y);
        ctx.lineTo(sling.x + 18 * scale, sling.y - 23 * scale);
        ctx.stroke();
    }

    if (bird.isLaunched) {
        bird.vx *= 0.99;
        bird.vy += 0.35 * scale; 
        bird.x += bird.vx;
        bird.y += bird.vy;

        if (bird.type === "black") {
            let hitGround = bird.y > groundY;
            let hitTarget = targets.some(t => checkCollision(bird, t));
            if (hitGround || hitTarget) {
                explodeBlackBird(bird.x, bird.y);
            }
        } else {
            targets.forEach(t => {
                if (checkCollision(bird, t)) {
                    t.alive = false;
                    score += (t.type === "pig" ? 300 : 150);
                    createDebris(t.x, t.y, t.type === "pig" ? "#7acc29" : "#b5651d");
                }
            });
        }

        if (bird.y > groundY || bird.x > canvas.width || bird.x < 0) {
            bird.isLaunched = false;
            handleBirdFinish();
        }
    }

    subBirds.forEach((sb, index) => {
        sb.vx *= 0.99;
        sb.vy += 0.35 * scale;
        sb.x += sb.vx;
        sb.y += sb.vy;

        targets.forEach(t => {
            if (t.alive && Math.hypot(sb.x - (t.type==="pig"?t.x:t.x+t.width/2), sb.y - (t.type==="pig"?t.y:t.y+t.height/2)) < sb.radius + 20) {
                t.alive = false;
                score += 150;
                createDebris(t.x, t.y, "#7acc29");
            }
        });

        drawBirdByType("blue", sb.x, sb.y, sb.radius);

        if (sb.y > groundY || sb.x > canvas.width || sb.x < 0) {
            subBirds.splice(index, 1);
        }
    });

    if (bird.type === "blue" && bird.isLaunched && bird.x === -9999 && subBirds.length === 0) {
        bird.isLaunched = false;
        handleBirdFinish();
    }

    drawBirdByType(bird.type, bird.x, bird.y, bird.radius);

    explosions.forEach((ex, idx) => {
        ex.radius += 8;
        ex.alpha -= 0.05;
        ctx.save();
        ctx.beginPath();
        ctx.arc(ex.x, ex.y, ex.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 100, 0, ${Math.max(ex.alpha, 0)})`;
        ctx.fill();
        ctx.strokeStyle = `rgba(255, 255, 0, ${Math.max(ex.alpha, 0)})`;
        ctx.lineWidth = 4;
        ctx.stroke();
        ctx.restore();
        if (ex.alpha <= 0 || ex.radius > ex.maxRadius) {
            explosions.splice(idx, 1);
        }
    });

    targets.forEach(t => {
        if (!t.alive) return;
        if (t.type === "pig") {
            let hasSupport = false;
            trapezoidPlatforms.forEach(plat => {
                if (t.x >= plat.x && t.x <= plat.x + plat.width && Math.abs(t.y + t.radius - plat.y) < 10) {
                    hasSupport = true;
                }
            });
            targets.forEach(other => {
                if (other.alive && other.type !== "pig") {
                    if (t.x >= other.x && t.x <= other.x + other.width && Math.abs(t.y + t.radius - other.y) < 10) {
                        hasSupport = true;
                    }
                }
            });

            if (!hasSupport && t.y < groundY - t.radius) {
                t.vy += 0.4 * scale;
                t.y += t.vy;
            } else {
                t.vy = 0;
            }

            if (t.y >= groundY - t.radius) {
                t.y = groundY - t.radius;
            }

            drawPig(t.x, t.y, t.radius);
        } else {
            ctx.save();
            ctx.translate(t.x, t.y);
            if (t.type === "wood") {
                ctx.fillStyle = "#c27329";
                ctx.strokeStyle = "#874d12";
            } else if (t.type === "stone") {
                ctx.fillStyle = "#a8a8a8";
                ctx.strokeStyle = "#666666";
            } else if (t.type === "ice") {
                ctx.fillStyle = "rgba(135, 220, 255, 0.8)";
                ctx.strokeStyle = "#0288d1";
            }
            ctx.fillRect(0, 0, t.width, t.height);
            ctx.lineWidth = 2 * scale;
            ctx.strokeRect(0, 0, t.width, t.height);
            ctx.restore();
        }
    });

    particles.forEach((p, index) => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.2 * scale;
        p.alpha -= 0.025;
        ctx.fillStyle = p.color;
        ctx.globalAlpha = Math.max(p.alpha, 0);
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1.0;
        if (p.alpha <= 0) particles.splice(index, 1);
    });

    ctx.restore();

    ctx.fillStyle = "rgba(10, 25, 40, 0.85)";
    ctx.fillRect(20, 20, 390, 95 * scale);
    ctx.strokeStyle = "rgba(255, 204, 0, 0.6)";
    ctx.lineWidth = 2.5;
    ctx.strokeRect(20, 20, 390, 95 * scale);

    ctx.fillStyle = "#ffcc00";
    ctx.font = `bold ${Math.round(18 * scale)}px Arial, sans-serif`;
    ctx.textAlign = "left";
    ctx.fillText(`MÀN: ${currentLevel}/40`, 35, 52 * scale);
    ctx.fillText(`ĐIỂM: ${score}`, 210, 52 * scale);

    ctx.fillStyle = "#ffffff";
    ctx.font = `bold ${Math.round(15 * scale)}px Arial, sans-serif`;
    ctx.fillText("Chim Trang Bị:", 35, 88 * scale);
    
    for (let i = currentBirdIndex; i < birdTypes.length; i++) {
        drawBirdByType(birdTypes[i], 165 + (i - currentBirdIndex) * 45 * scale, 82 * scale, 15 * scale);
    }

    let remainingPigs = targets.some(t => t.type === "pig" && t.alive);
    if (!remainingPigs && gameState === "PLAYING") {
        setTimeout(() => { if (gameState === "PLAYING") endGame(true); }, 300);
    }

    requestAnimationFrame(update);
}

resizeCanvas();
requestAnimationFrame(update);
</script>
</body>
